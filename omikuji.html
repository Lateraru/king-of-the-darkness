  var FORTUNES = [
    { name: '大吉', w: 12 }, { name: '中吉', w: 22 }, { name: '小吉', w: 24 },
    { name: '吉', w: 22 }, { name: '末吉', w: 14 }, { name: '凶', w: 6 }
  ];
  var ITEMS = ['紫水晶の杖', '大きな黒いリボン', '銀のアミュレット', '王冠', 'マイク', '黒い手袋', '魔法陣のメモ帳', 'ハンバーグのキーホルダー'];
  var COLORS = ['紫', '黒', '赤', 'エメラルドグリーン', 'ピンク', '銀色'];
  var SPOTS = ['魔王城の玉座の間', 'ピグパーティのパーティー会場', '秘密基地', 'らてまりチャンネルの動画の中', 'お城の図書室'];
  var VOICES = {
    '大吉': { r: '見事だ今日の魔王はご機嫌だぞ', k: 'すごーい♡ 今日はらて子も太鼓判だぉ' },
    '中吉': { r: '悪くない運気だその調子で進め', k: 'いい感じだぉその笑顔で大丈夫' },
    '小吉': { r: '小さな幸運は、拾った者のものだ', k: 'ちっちゃなラッキー、見逃さないでね' },
    '吉': { r: '平穏こそ力だ今日はそれでよい', k: 'ふつうの日が、いちばん平和だぉ' },
    '末吉': { r: '焦るな運気はこれから上向く', k: 'あとから良くなる日だぉのんびりいこ' },
    '凶': { r: 'ふむ今日は城で大人しくしているがよい', k: '今日は無理しないでお茶でも飲も' }
  };

  function todayKey(){
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  function pickFortune(){
    var total = FORTUNES.reduce(function(a, f){ return a + f.w; }, 0);
    var x = Math.random() * total;
    for (var i = 0; i < FORTUNES.length; i++) { x -= FORTUNES[i].w; if (x <= 0) return FORTUNES[i].name; }
    return '吉';
  }

  var btn = document.getElementById('btnDraw');
  var note = document.getElementById('note');
  var result = document.getElementById('result');
  var kujiImg = document.getElementById('kujiImg');

  function show(data){
    document.getElementById('fortune').textContent = data.f;
    document.getElementById('item').textContent = data.i;
    document.getElementById('color').textContent = data.c;
    document.getElementById('spot').textContent = data.s;
    document.getElementById('voiceR').textContent = VOICES[data.f].r;
    document.getElementById('voiceK').textContent = VOICES[data.f].k;
    result.classList.add('show');
    showOverNav();
  }

  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('maouOmikuji') || 'null'); } catch(e) {}
  if (saved && saved.day === todayKey()) {
    show(saved);
    btn.disabled = true;
    btn.textContent = '今日はもう引きました';
    note.textContent = 'また明日、引きに来てください';
  }

  btn.addEventListener('click', function(){
    if (btn.disabled) return;
    btn.disabled = true;
    kujiImg.classList.add('shake');
    note.textContent = 'ガラガラ…';
    setTimeout(function(){
      kujiImg.classList.remove('shake');
      var data = { day: todayKey(), f: pickFortune(), i: pick(ITEMS), c: pick(COLORS), s: pick(SPOTS) };
      try { localStorage.setItem('maouOmikuji', JSON.stringify(data)); } catch(e) {}
      show(data);
      btn.textContent = '今日はもう引きました';
      note.textContent = 'また明日、引きに来てください';
    }, 900);
  });
