<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>城壁崩し | ミニゲーム | 魔王らてらる・魔王らて子 公式ファンサイト</title>
<link rel="stylesheet" href="style.css">
<style>
  canvas#game{width:100%;height:auto;display:block;background:#0b0817;border:2px solid var(--line);border-radius:12px;touch-action:none}
  .game-ui{display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .game-ui button{padding:10px 22px;border:none;border-radius:10px;background:var(--red);color:#fff;font-size:1rem;cursor:pointer}
  .score-line b{font-size:1.25rem}
  .back-list{margin-top:28px}
</style>
</head>
<body>

<header class="site">
  <div class="inner">
    <a class="logo" href="index.html">魔王<span>らてらる</span> × 魔王<span>らて子</span></a>
    <nav class="main">
      <a href="index.html">ホーム</a>
      <a href="index.html#news">お知らせ</a>
      <a href="board.html">ファン掲示板</a>
      <a href="chat.html">AIチャット</a>
      <a href="games.html" class="active">ミニゲーム</a>
      <a href="secret.html">秘密基地</a>
    </nav>
  </div>
</header>

<main>
  <h1 class="page">城壁崩し</h1>
  <p class="lead">跳ね返る魔法玉で城壁を崩そう。下の台は指やマウス、←→キーで動きます。</p>

  <canvas id="game" width="900" height="420"></canvas>
  <div class="game-ui">
    <button type="button" id="btnAction">スタート</button>
    <span class="score-line">スコア <b id="scoreNow">0</b> ／ ハイスコア <b id="scoreHigh">0</b> ／ 残り玉 <b id="lives">3</b> ／ 面 <b id="level">1</b></span>
  </div>

  <div class="back-list">
    <div class="menu-grid">
      <a href="games.html"><div class="t">ミニゲーム一覧</div><div class="d">他のゲームも遊べます</div></a>
    </div>
  </div>
</main>

<footer class="site">
  魔王らてらる・魔王らて子 公式ファンサイト（trailer-project.com）
</footer>

<script>
(function(){
  "use strict";
  var W = 900, H = 420;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var elNow = document.getElementById('scoreNow'), elHigh = document.getElementById('scoreHigh'), elLives = document.getElementById('lives'), elLevel = document.getElementById('level');
  var btn = document.getElementById('btnAction');

  var high = 0;
  try { high = parseInt(localStorage.getItem('maouBreakBest') || '0', 10) || 0; } catch(e) {}
  elHigh.textContent = high;

  var ROWS = 5, COLS = 9, BW = 88, BH = 24, GAP = 8, TOP = 64, LEFT = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;
  var ROWCOLORS = ['#e5484d', '#a06cd5', '#7a4fd0', '#4d9de5', '#3d2a5e'];

  var state = 'ready';
  var paddle = { x: W / 2, w: 118 };
  var ball = { x: W / 2, y: H - 70, vx: 3.4, vy: -4.2, r: 8 };
  var bricks = [], score = 0, lives = 3, level = 1, keys = {}, targetX = null;

  function buildBricks(){
    bricks = [];
    for (var r = 0; r < ROWS; r++)
      for (var c = 0; c < COLS; c++)
        bricks.push({ x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP), alive: true, color: ROWCOLORS[r] });
  }
  function resetBall(){
    ball.x = paddle.x; ball.y = H - 70;
    var sp = 5.2 + level * 0.5;
    var ang = (Math.random() * 0.5 + 0.35) * (Math.random() < 0.5 ? 1 : -1);
    ball.vx = Math.sin(ang) * sp;
    ball.vy = -Math.cos(ang) * sp;
  }
  function reset(full){
    if (full) { score = 0; lives = 3; level = 1; }
    elNow.textContent = score; elLives.textContent = lives; elLevel.textContent = level;
    buildBricks();
    paddle.x = W / 2;
    resetBall();
  }
  function start(){ reset(true); state = 'run'; btn.textContent = 'プレイ中…'; }
  function over(){
    state = 'over'; btn.textContent = 'もう一度';
    if (score > high) { high = score; elHigh.textContent = high; try { localStorage.setItem('maouBreakBest', String(high)); } catch(e) {} }
  }

  function step(){
    if (state === 'run') {
      if (keys.left) paddle.x -= 8;
      if (keys.right) paddle.x += 8;
      if (targetX !== null) paddle.x += (targetX - paddle.x) * 0.4;
      paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -1; }
      if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; }

      var py = H - 40;
      if (ball.vy > 0 && ball.y + ball.r >= py && ball.y + ball.r <= py + 16 && Math.abs(ball.x - paddle.x) <= paddle.w / 2 + ball.r) {
        var rel = (ball.x - paddle.x) / (paddle.w / 2);
        var sp = Math.hypot(ball.vx, ball.vy);
        var ang = rel * 1.05;
        ball.vx = Math.sin(ang) * sp;
        ball.vy = -Math.cos(ang) * sp;
        ball.y = py - ball.r;
      }

      for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i];
        if (!b.alive) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BW && ball.y + ball.r > b.y && ball.y - ball.r < b.y + BH) {
          b.alive = false;
          score += 10;
          elNow.textContent = score;
          ball.vy *= -1;
          break;
        }
      }
      if (bricks.every(function(b){ return !b.alive; })) {
        level++;
        elLevel.textContent = level;
        buildBricks();
        resetBall();
      }
      if (ball.y - ball.r > H) {
        lives--;
        elLives.textContent = lives;
        if (lives <= 0) over(); else resetBall();
      }
    }
    draw();
    requestAnimationFrame(step);
  }

  function draw(){
    ctx.fillStyle = '#0b0817'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#17102b'; ctx.fillRect(0, 0, W, 44);
    ctx.fillStyle = '#cfc4ee'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('― 魔王城の城壁 ―', W / 2, 22);

    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, BW, BH);
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fillRect(b.x, b.y, BW, 5);
    }
    // paddle
    ctx.fillStyle = '#a06cd5';
    ctx.fillRect(paddle.x - paddle.w / 2, H - 40, paddle.w, 12);
    ctx.fillStyle = '#e5484d';
    ctx.fillRect(paddle.x - paddle.w / 2, H - 40, paddle.w, 4);
    // ball
    ctx.fillStyle = '#f3eefc';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(160,108,213,0.35)';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r + 4, 0, Math.PI * 2); ctx.fill();

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (state === 'ready') {
      ctx.fillStyle = 'rgba(11,8,23,0.55)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 30px sans-serif';
      ctx.fillText('城壁崩し', W / 2, H / 2 - 14);
      ctx.font = '18px sans-serif'; ctx.fillStyle = '#cfc4ee';
      ctx.fillText('スタートか画面タップで開始', W / 2, H / 2 + 24);
    } else if (state === 'over') {
      ctx.fillStyle = 'rgba(11,8,23,0.62)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 32px sans-serif';
      ctx.fillText('ゲームオーバー', W / 2, H / 2 - 24);
      ctx.font = '20px sans-serif'; ctx.fillStyle = '#cfc4ee';
      ctx.fillText('スコア ' + score + ' ／ ハイスコア ' + high, W / 2, H / 2 + 14);
    }
  }

  function canvasX(clientX){
    var r = canvas.getBoundingClientRect();
    return (clientX - r.left) * (W / r.width);
  }
  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault();
    if (state !== 'run') { start(); return; }
    targetX = canvasX(e.clientX);
  });
  canvas.addEventListener('pointermove', function(e){ if (state === 'run') targetX = canvasX(e.clientX); });
  document.addEventListener('keydown', function(e){
    if (e.code === 'ArrowLeft') keys.left = true;
    if (e.code === 'ArrowRight') keys.right = true;
  });
  document.addEventListener('keyup', function(e){
    if (e.code === 'ArrowLeft') keys.left = false;
    if (e.code === 'ArrowRight') keys.right = false;
  });
  btn.addEventListener('click', function(){ if (state !== 'run') start(); });

  reset(true);
  state = 'ready';
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
