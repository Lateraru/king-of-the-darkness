  var SYMBOLS = [
    { id: 'rateraru', html: '<img alt="魔王らてらる" src="' + SPR_R + '">', face: true },
    { id: 'rateko',   html: '<img alt="魔王らて子" src="' + SPR_K + '">', face: true },
    { id: 'crown',    html: '👑' },
    { id: 'crystal',  html: '🔮' },
    { id: 'bat',      html: '🦇' },
    { id: 'rose',     html: '🌹' },
    { id: 'mic',      html: '🎤' }
  ];
  var reels = [document.getElementById('reel0'), document.getElementById('reel1'), document.getElementById('reel2')];
  var elPoints = document.getElementById('points'), elMax = document.getElementById('maxPoints'), elMsg = document.getElementById('msg');
  var btn = document.getElementById('btnSpin'), btnGift = document.getElementById('btnGift');

  var points = 100, maxPoints = 100, spinning = false;
  try {
    var saved = JSON.parse(localStorage.getItem('maouSlot') || 'null');
    if (saved) { points = saved.p; maxPoints = saved.m; }
  } catch(e) {}
  elPoints.textContent = points; elMax.textContent = maxPoints;
  if (points < 10) btnGift.style.display = 'inline-block';

  function save(){ try { localStorage.setItem('maouSlot', JSON.stringify({ p: points, m: maxPoints })); } catch(e) {} }
  function randSym(){ return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]; }
  function setReel(i, s){ reels[i].innerHTML = s.html; reels[i].dataset.id = s.id; reels[i].dataset.face = s.face ? '1' : ''; }

  function finish(finals){
    spinning = false;
    btn.disabled = false;
    var ids = finals.map(function(s){ return s.id; });
    var win = 0, label = '';
    if (ids[0] === ids[1] && ids[1] === ids[2]) {
      if (finals[0].face) { win = 500; label = '顔が3つ揃った。大当たり'; }
      else { win = 200; label = '絵柄が3つ揃った。当たり'; }
      reels.forEach(function(r){ r.classList.add('win'); });
    } else if (ids[0] === ids[1] || ids[1] === ids[2] || ids[0] === ids[2]) {
      win = 20; label = '2つ揃い';
    }
    if (win > 0) {
      points += win;
      elMsg.textContent = label + ' ＋' + win + ' ポイント';
    } else {
      elMsg.textContent = 'はずれ。また回してみよう';
    }
    if (points > maxPoints) maxPoints = points;
    elPoints.textContent = points; elMax.textContent = maxPoints;
    btnGift.style.display = points < 10 ? 'inline-block' : 'none';
    save();
  }

  btn.addEventListener('click', function(){
    if (spinning || points < 10) return;
    spinning = true;
    btn.disabled = true;
    btnGift.style.display = 'none';
    elMsg.textContent = '';
    reels.forEach(function(r){ r.classList.remove('win'); });
    points -= 10;
    elPoints.textContent = points;
    save();
    var finals = [randSym(), randSym(), randSym()];
    var timers = reels.map(function(r, i){
      return setInterval(function(){ setReel(i, randSym()); }, 70);
    });
    timers.forEach(function(t, i){
      setTimeout(function(){
        clearInterval(t);
        setReel(i, finals[i]);
        if (i === 2) setTimeout(function(){ finish(finals); }, 120);
      }, 600 + i * 450);
    });
  });

  btnGift.addEventListener('click', function(){
    points += 100;
    elPoints.textContent = points;
    elMsg.textContent = '魔王の施し。ありがたく受け取ろう';
    btnGift.style.display = 'none';
    save();
  });
})();
