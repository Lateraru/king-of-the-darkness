  .stage{max-width:480px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}
  .cell{aspect-ratio:1;border-radius:50%;border:2px solid var(--purple);background:#1b1430;color:#fff;font-size:1.15rem;cursor:pointer;-webkit-tap-highlight-color:transparent}

  .hud{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

<main>
  <h1 class="page">魔法陣起動</h1>
  <p class="lead">1から順番にタップして魔法陣を起動しよう<br>25モードと50モードのタイムアタックです</p>

  <div class="stage">
    <div class="hud">
      <span>次は <b id="next">1</b></span>
      <span>時間 <b id="time">0.0</b> 秒</span>
      <span>ミス <b id="miss">0</b></span>
      <button type="button" id="btnStart">スタート</button>
    </div>
    <div class="hud" style="margin-top:10px">
      <button type="button" id="btnMode25">1〜25モード</button>
      <button type="button" id="btnMode50">1〜50モード</button>
      <span id="modeLabel">いまは1〜25モード</span>
    </div>
    <p style="text-align:center;margin-bottom:0">ミス1回につきペナルティ <b>+3秒</b>　いまのペナルティ <b id="penalty">+0秒</b></p>
    <div class="grid" id="grid"></div>
    <p id="msg" style="text-align:center;min-height:1.6em"></p>
    <p id="lateko" style="text-align:center;min-height:1.6em;color:#d8b4fe">魔王らて子だぉ♡ 順番にタップするぉ</p>
    <p style="text-align:center">ベストタイム：<b id="best">―</b></p>
  </div>

  <div class="back-list">
    <div class="menu-grid">
      <a href="games.html"><div class="t">ミニゲーム一覧</div><div class="d">他のゲームも遊べます</div></a>
    </div>
  </div>
</main>

  魔王らてらる・魔王らて子 公式ファンサイト（trailer-project.com）
</footer>

<script>
(function(){
  "use strict";
  var grid = document.getElementById('grid');
  var elNext = document.getElementById('next'), elTime = document.getElementById('time'), elMiss = document.getElementById('miss'), elMsg = document.getElementById('msg'), elBest = document.getElementById('best');
  var elPenalty = document.getElementById('penalty'), elLateko = document.getElementById('lateko'), elModeLabel = document.getElementById('modeLabel');
  var btn = document.getElementById('btnStart');
  var btnMode25 = document.getElementById('btnMode25'), btnMode50 = document.getElementById('btnMode50');

  var maxNum = 25;
  var best25 = 0, best50 = 0;
  try { best25 = parseFloat(localStorage.getItem('maouNumbersBest') || '0') || 0; } catch(e) {}
  try { best50 = parseFloat(localStorage.getItem('maouNumbersBest50') || '0') || 0; } catch(e) {}

  var LATEKO_CHEERS = [
    '魔王らて子だぉ♡ その調子だぉ',
    'いい感じだぉ♡ 次も見つけるぉ',
    'すごいぉ♡ 魔法陣が光ってるぉ',
    'あと少しだぉ♡ 落ち着いていくぉ'
  ];
  var LATEKO_MISS = [
    'ドンマイだぉ♡ 次は合ってるぉ',
    'おしいぉ♡ ペナルティ+3秒だけどまだいけるぉ',
    '大丈夫だぉ♡ 順番を思い出すぉ'
  ];

  function currentBest(){ return maxNum === 50 ? best50 : best25; }
  function showBest(){
    var b = currentBest();
    elBest.textContent = b ? b.toFixed(1) + ' 秒（1〜' + maxNum + 'モード）' : '―';
  }
  function penaltySec(){ return miss * 3; }
  function showPenalty(){ elPenalty.textContent = '+' + penaltySec() + '秒'; }
  function cheerFor(n){
    if (n % 10 === 0) elLateko.textContent = LATEKO_CHEERS[Math.floor(n / 10 - 1) % LATEKO_CHEERS.length];
  }
  showBest();

  var playing = false, next = 1, miss = 0, startedAt = 0, timer = null;

  function build(){
    var nums = [];
    for (var i = 1; i <= maxNum; i++) nums.push(i);
    for (var j = nums.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = nums[j]; nums[j] = nums[k]; nums[k] = t;
    }
    grid.innerHTML = '';
    nums.forEach(function(n){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cell';
      b.textContent = n;
      b.addEventListener('click', function(){ tap(b, n); });
      grid.appendChild(b);
    });
  }

  function tap(b, n){
    if (!playing || b.classList.contains('hit')) return;
    if (n === next) {
      b.classList.add('hit');
      cheerFor(n);
      next++;
      elNext.textContent = next <= maxNum ? next : '―';
      if (next > maxNum) {
        playing = false;
        clearInterval(timer);
        var elapsed = (Date.now() - startedAt) / 1000;
        var t = elapsed + penaltySec();
        elTime.textContent = t.toFixed(1);
        elMsg.textContent = '魔法陣、起動　合計 ' + t.toFixed(1) + ' 秒（経過 ' + elapsed.toFixed(1) + ' 秒＋ペナルティ +' + penaltySec() + ' 秒／ミス ' + miss + ' 回）';
        elLateko.textContent = 'やったぉ♡ 魔法陣バッチリ起動だぉ';
        if (!currentBest() || t < currentBest()) {
          if (maxNum === 50) {
            best50 = t;
            try { localStorage.setItem('maouNumbersBest50', String(best50)); } catch(e) {}
          } else {
            best25 = t;
            try { localStorage.setItem('maouNumbersBest', String(best25)); } catch(e) {}
          }
          showBest();
        }
        btn.textContent = 'もう一度';
        showOverNav();
      }
    } else {
      miss++;
      elMiss.textContent = miss;
      showPenalty();
      elLateko.textContent = LATEKO_MISS[(miss - 1) % LATEKO_MISS.length];
      b.classList.remove('miss'); void b.offsetWidth; b.classList.add('miss');
    }
  }

  function startGame(){
    next = 1; miss = 0;
    elNext.textContent = '1'; elMiss.textContent = '0'; elTime.textContent = '0.0'; elMsg.textContent = '';
    showPenalty();
    elLateko.textContent = '魔王らて子だぉ♡ 1から順番にタップするぉ';
    build();
    playing = true;
    startedAt = Date.now();
    clearInterval(timer);
    timer = setInterval(function(){ elTime.textContent = ((Date.now() - startedAt) / 1000 + penaltySec()).toFixed(1); }, 100);
    btn.textContent = 'リスタート';
  }

  function setMode(n){
    maxNum = n;
    playing = false;
    clearInterval(timer);
    next = 1; miss = 0;
    elNext.textContent = '1'; elMiss.textContent = '0'; elTime.textContent = '0.0'; elMsg.textContent = '';
    showPenalty();
    elModeLabel.textContent = 'いまは1〜' + maxNum + 'モード';
    elLateko.textContent = maxNum === 50 ? '50モードだぉ♡ 長いけど一緒にいくぉ' : '魔王らて子だぉ♡ 順番にタップするぉ';
    showBest();
    build();
    btn.textContent = 'スタート';
  }

  btn.addEventListener('click', startGame);
  btnMode25.addEventListener('click', function(){ setMode(25); });
  btnMode50.addEventListener('click', function(){ setMode(50); });

  build();
})();
</script>

<script>
/* 人気カウンター: デプロイ時に STATS_BASE へ接続先を設定（それまでは何もしません） */
(function(){
  var STATS_BASE = '';
  if (!STATS_BASE) return;
  try {
    var slug = 'numbers';
    var today = new Date().toLocaleDateString('sv-SE');
    var seen = {};
    try { seen = JSON.parse(localStorage.getItem('maouHitV1') || '{}'); } catch (e) {}
    if (seen[slug] === today) return;
    seen[slug] = today;
    try { localStorage.setItem('maouHitV1', JSON.stringify(seen)); } catch (e) {}
    fetch(STATS_BASE + '/api/hit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: slug }), keepalive: true }).catch(function(){});
  } catch (e) {}
})();
</script>

<script>
/* 導線クリック記録: デプロイ時に STATS_BASE へ接続先を設定（それまでは何もしません） */
(function(){
  var STATS_BASE = '';
  if (!STATS_BASE) return;
  document.addEventListener('click', function(ev){
    var a = (ev.target && ev.target.closest) ? ev.target.closest('a[href]') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    var dest = '';
    if (href.indexOf('store.line.me') >= 0) dest = 'line';
    else if (href.indexOf('line.me/ti/g2') >= 0) dest = 'linechat';
    else if (href.indexOf('YL26sVq0rjE') >= 0) dest = 'mv404';
    else if (href.indexOf('6c3PI1Vy3Nc') >= 0) dest = 'healing';
    else if (href.indexOf('youtube.com/@latemarined') >= 0) dest = 'youtube';
    if (!dest) return;
    fetch(STATS_BASE + '/api/click', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to: dest }), keepalive: true }).catch(function(){});
  }, true);
})();
</script>
