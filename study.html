function mathQuestion(){
  var kind = ['add', 'sub', 'mul', 'div', 'area', 'perim', 'avg', 'unit', 'remain'][rnd(0, 8)];
  var q, ans;
  if (kind === 'add'){ var a = rnd(12, 98), b = rnd(12, 98); q = a + ' + ' + b; ans = a + b; }
  else if (kind === 'sub'){ var a2 = rnd(21, 99), b2 = rnd(11, a2 - 1); q = a2 + ' - ' + b2; ans = a2 - b2; }
  else if (kind === 'mul'){ var a3 = rnd(2, 9), b3 = rnd(2, 9); q = a3 + ' × ' + b3; ans = a3 * b3; }
  else if (kind === 'div') { var d = rnd(2, 9), quo = rnd(2, 9); q = (d * quo) + ' ÷ ' + d; ans = quo; }
  else if (kind === 'area'){ var w = rnd(2, 12), h = rnd(2, 9); q = 'たて ' + h + 'cm、よこ ' + w + 'cm の長方形の面積（平方cm）'; ans = w * h; }
  else if (kind === 'perim'){ var w2 = rnd(3, 15), h2 = rnd(3, 12); q = 'たて ' + h2 + 'cm、よこ ' + w2 + 'cm の長方形のまわりの長さ（cm）'; ans = 2 * (w2 + h2); }
  else if (kind === 'avg'){ var n1 = rnd(2, 9) * 10, n2 = rnd(2, 9) * 10; q = n1 + '点と ' + n2 + '点の平均（点）'; ans = (n1 + n2) / 2; }
  else if (kind === 'unit'){ var m = rnd(2, 9); q = m + 'm は何cm'; ans = m * 100; }
  else { var dd = rnd(3, 9), qq = rnd(2, 8), rr = rnd(1, dd - 1); q = (dd * qq + rr) + ' ÷ ' + dd + ' のあまり'; ans = rr; }
  var opts = [ans];
  var cand = [ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, ans + 3, ans * 2];
  for (var i = 0; i < cand.length && opts.length < 3; i++){
    if (cand[i] >= 0 && opts.indexOf(cand[i]) < 0) opts.push(cand[i]);
  }
  return { q: '計算しましょう： ' + q + ' = ?', choices: shuffle(opts).map(String), answer: String(ans), ex: q + ' = ' + ans + ' です' };
}

  var opts = [p[1]];
  while (opts.length < 3){
    var c = PREFS47[rnd(0, PREFS47.length - 1)][1];
    if (opts.indexOf(c) < 0) opts.push(c);
  }
  return { q: p[0] + 'の県庁所在地は？', choices: shuffle(opts), answer: p[1], ex: p[0] + 'の県庁所在地は' + p[1] + 'です' };
}
function bankQuestion(bank){
  var item = bank[rnd(0, bank.length - 1)];
  return { q: item[0], choices: shuffle([item[1]].concat(item[2])), answer: item[1], ex: item[3] };
}
function makeSet(cat){
  var set = [];
  var used = {};
  var guard = 0;
  while (set.length < 10 && guard++ < 300){
    var c = cat;
    if (cat === 'mix') c = ['math', 'pref', 'science', 'english', 'social', 'kanji'][rnd(0, 5)];
    var item;
    if (c === 'math') item = mathQuestion();
    else if (c === 'pref') item = prefQuestion();
    else if (c === 'science') item = bankQuestion(SCIENCE);
    else if (c === 'english') item = bankQuestion(ENGLISH);
    else if (c === 'social') item = bankQuestion(SOCIAL);
    else item = bankQuestion(KANJI);
    if (used[item.q]) continue;
    used[item.q] = true;
    set.push(item);
  }
  return set;
}

var quiz = null;
function showBest(){
  var b = localStorage.getItem('maouStudyBest');
  $('best').textContent = b ? b + '問正解' : '―';
}
function showQuestion(){
  var item = quiz.list[quiz.idx];
  $('prog').textContent = (quiz.idx + 1) + ' / 10 問目';
  $('score').textContent = '正解 ' + quiz.correct + ' 問';
  $('combo').textContent = quiz.combo >= 2 ? '🔥 ' + quiz.combo + '連続正解中' : '';
  $('qtext').textContent = item.q;
  $('explain').style.display = 'none';
  $('nextBtn').style.display = 'none';
  var box = $('choices');
  box.innerHTML = '';
  item.choices.forEach(function(c){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = c;
    btn.addEventListener('click', function(){ answer(btn, c, item); });
    box.appendChild(btn);
  });
}
function answer(btn, choice, item){
  var buttons = $('choices').querySelectorAll('button');
  buttons.forEach(function(b){
    b.disabled = true;
    if (b.textContent === item.answer) b.classList.add('right');
  });
  if (choice === item.answer){ quiz.correct++; quiz.combo++; if (quiz.combo > quiz.maxCombo) quiz.maxCombo = quiz.combo; }
  else { btn.classList.add('wrong'); quiz.combo = 0; }
  $('combo').textContent = quiz.combo >= 2 ? '🔥 ' + quiz.combo + '連続正解中' : '' ;
  var ex = $('explain');
  ex.innerHTML = (choice === item.answer ? '⭕ 正解です<br>' : '❌ 答えは「' + item.answer + '」でした<br>') + item.ex;
  ex.style.display = 'block';
  $('score').textContent = '正解 ' + quiz.correct + ' 問';
  var nb = $('nextBtn');
  nb.textContent = quiz.idx >= quiz.list.length - 1 ? '結果を見る' : '次の問題へ';
  nb.style.display = 'inline-block';
}
function finish(){
  $('qbox').style.display = 'none';
  var prev = Number(localStorage.getItem('maouStudyBest') || 0);
  if (quiz.correct > prev) localStorage.setItem('maouStudyBest', quiz.correct);
  showBest();
  showOverNav();
  var sec = Math.round((Date.now() - quiz.t0) / 1000);
  var comment = quiz.correct === 10 ? '全問正解です　お勉強マスター！' : quiz.correct >= 7 ? 'よくできました　あと少しで全問正解です' : quiz.correct >= 4 ? 'その調子です　解説を読んで覚えましょう' : '解説を読めば次はできます　もう一度挑戦しましょう';
  $('studyResult').innerHTML = '結果： 10問中 <b>' + quiz.correct + ' 問</b> 正解でした（' + sec + '秒）<br>最大コンボ： ' + quiz.maxCombo + '連続正解<br>' + comment;
}
$('nextBtn').addEventListener('click', function(){
  quiz.idx++;
  if (quiz.idx >= quiz.list.length) finish();
  else showQuestion();
});
$('startBtn').addEventListener('click', function(){
  quiz = { list: makeSet($('catSel').value), idx: 0, correct: 0, combo: 0, maxCombo: 0, t0: Date.now() };
  $('overNav').style.display = 'none';
  $('qbox').style.display = 'block';
  showQuestion();
});
showBest();
</script>

<script>
/* 人気カウンター: デプロイ時に STATS_BASE へ接続先を設定（それまでは何もしません） */
(function(){
  var STATS_BASE = '';
  if (!STATS_BASE) return;
  try {
    var slug = 'study';
    var today = new Date().toLocaleDateString('sv-SE');
    var seen = {};
    try { seen = JSON.parse(localStorage.getItem('maouHitV1') || '{}'); } catch (e) {}
    if (seen[slug] === today) return;
    seen[slug] = today;
    try { localStorage.setItem('maouHitV1', JSON.stringify(seen)); } catch (e) {}
    fetch(STATS_BASE + '/api/hit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: slug }), keepalive: true }).catch(function(){});
  } catch (e) {}
})();
</script>

<script>
/* 導線クリック記録: デプロイ時に STATS_BASE へ接続先を設定（それまでは何もしません） */
(function(){
  var STATS_BASE = '';
  if (!STATS_BASE) return;
  document.addEventListener('click', function(ev){
    var a = (ev.target && ev.target.closest) ? ev.target.closest('a[href]') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    var dest = '';
    if (href.indexOf('store.line.me') >= 0) dest = 'line';
    else if (href.indexOf('line.me/ti/g2') >= 0) dest = 'linechat';
    else if (href.indexOf('YL26sVq0rjE') >= 0) dest = 'mv404';
    else if (href.indexOf('6c3PI1Vy3Nc') >= 0) dest = 'healing';
    else if (href.indexOf('youtube.com/@latemarined') >= 0) dest = 'youtube';
    if (!dest) return;
    fetch(STATS_BASE + '/api/click', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to: dest }), keepalive: true }).catch(function(){});
  }, true);
})();
</script>
