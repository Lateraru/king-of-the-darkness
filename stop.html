<script>

}
</script>
<script>
function $(id){ return document.getElementById(id); }
var state = 'idle'; // idle | running | stopped
var t0 = 0, timer = null;

function ratingFor(absDiff){
  if (absDiff <= 0.10) return '神業です！';
  if (absDiff <= 0.30) return 'すごい！　ほぼピッタリ';
  if (absDiff <= 0.50) return 'おしい！';
  if (absDiff <= 1.00) return 'なかなかの感覚です';
  return 'まだまだ　感覚を研ぎ澄ましましょう';
}
function loadBests(){
  try { return JSON.parse(localStorage.getItem('maouStopBestV1') || '{}'); } catch(e){ return {}; }
}
function showBest(){
  var target = $('targetSel').value;
  var bests = loadBests();
  var b = bests[target];
  $('bestLine').textContent = b !== undefined ? 'この目標のベスト： ' + b.toFixed(2) + ' 秒のズレ' : 'この目標のベスト： まだありません';
}
function fmt(sec){ return sec.toFixed(2); }

function startGame(){
  state = 'running';
  t0 = performance.now();
  $('result').innerHTML = '';
  $('targetSel').disabled = true;
  $('mainBtn').textContent = 'ストップ';
  timer = setInterval(function(){
    var el = (performance.now() - t0) / 1000;
    $('clock').textContent = el < 2 ? fmt(el) : '？.？？';
  }, 31);
}
function stopGame(){
  clearInterval(timer);
  var el = (performance.now() - t0) / 1000;
  var target = Number($('targetSel').value);
  var diff = el - target;
  var abs = Math.abs(diff);
  $('clock').textContent = fmt(el);
  var dir = diff === 0 ? 'ピッタリ' : (diff > 0 ? '遅かったです' : '早かったです');
  var bests = loadBests();
  var prev = bests[String(target)];
  var isRecord = prev === undefined || abs < prev;
  if (isRecord){
    bests[String(target)] = abs;
    localStorage.setItem('maouStopBestV1', JSON.stringify(bests));
  }
  $('result').innerHTML = 'あなたは <b>' + fmt(el) + ' 秒</b> で止めました<br>'
    + '目標の ' + target + ' 秒より <b>' + fmt(abs) + ' 秒</b> ' + dir + '<br>'
    + '<span class="rating">' + ratingFor(abs) + '</span>'
    + (isRecord ? '<br>🎉 ベスト記録を更新しました' : '');
  state = 'stopped';
  $('mainBtn').textContent = 'もう一度';
  $('targetSel').disabled = false;
  showBest();
  showOverNav();
}
$('mainBtn').addEventListener('click', function(){
  if (state === 'running') stopGame();
  else startGame();
});
$('targetSel').addEventListener('change', showBest);
showBest();
</script>

<script>
/* 人気カウンター: デプロイ時に STATS_BASE へ接続先を設定（それまでは何もしません） */
(function(){
  var STATS_BASE = '';
  if (!STATS_BASE) return;
  try {
    var slug = 'stop';
    var today = new Date().toLocaleDateString('sv-SE');
    var seen = {};
    try { seen = JSON.parse(localStorage.getItem('maouHitV1') || '{}'); } catch (e) {}
    if (seen[slug] === today) return;
    seen[slug] = today;
    try { localStorage.setItem('maouHitV1', JSON.stringify(seen)); } catch (e) {}
    fetch(STATS_BASE + '/api/hit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: slug }), keepalive: true }).catch(function(){});
  } catch (e) {}
})();
</script>
