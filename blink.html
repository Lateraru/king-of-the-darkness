<main>
  <h1 class="page">高速まばたき対決</h1>
  <p class="lead">らて子と高速まばたき対決<br>10秒間、顔をタップし続けて何回まばたきできるか<br>まばたきは右目・左目・両目がランダム<br>終わったら何回つむったかのクイズが出ます</p>

  <div class="stage">
    <button type="button" class="face-btn" id="faceBtn"><img id="face" alt="魔王らて子"></button>
    <div class="timebar"><div id="timeLeft"></div></div>
    <div class="hud">
      <span>まばたき <b id="count">0</b> 回</span>
      <span>ベスト <b id="best">0</b> 回</span>
    </div>
    <p id="msg" style="min-height:1.8em">下のボタンでスタート<br>始まったら顔を連打</p>
    <button type="button" class="start-btn" id="btnStart">スタート</button>
    <div class="quiz" id="quiz" style="display:none">
      <p style="margin:0 0 6px"><strong>クイズ：どっちの目を何回つむった？</strong>（見た目の左右で答えてね）</p>
      <label>右目 <input type="number" id="qR" min="0" inputmode="numeric"> 回</label>
      <label>左目 <input type="number" id="qL" min="0" inputmode="numeric"> 回</label>
      <label>両目 <input type="number" id="qB" min="0" inputmode="numeric"> 回</label>
      <button type="button" class="start-btn" id="btnQuiz">答え合わせ</button>
      <p id="quizResult" style="min-height:1.6em;margin:8px 0 0"></p>
    </div>
  </div>

  var face = document.getElementById('face');
  var elCount = document.getElementById('count'), elBest = document.getElementById('best');
  var elTime = document.getElementById('timeLeft'), elMsg = document.getElementById('msg');
  var btn = document.getElementById('btnStart');
  face.src = IMG_OPEN; face.style.transform = '';

  var best = 0;
  try { best = parseInt(localStorage.getItem('maouBlinkBest') || '0', 10) || 0; } catch(e) {}
  elBest.textContent = best;

  var playing = false, count = 0, endAt = 0, tickTimer = null, wink = false;
  var cntR = 0, cntL = 0, cntB = 0;

  function rank(n){
    if (n >= 100) return '神速まばたき';
    if (n >= 80) return '高速まばたき';
    if (n >= 60) return 'なかなか速い';
    if (n >= 40) return '普通のまばたき';
    return 'ゆっくりまばたき';
  }

  function finish(){
    playing = false;
    showOverNav();
    clearInterval(tickTimer);
    elTime.style.width = '0%';
    face.src = IMG_OPEN; face.style.transform = '';
    if (count > best) {
      best = count; elBest.textContent = best;
      try { localStorage.setItem('maouBlinkBest', String(best)); } catch(e) {}
    }
    elMsg.textContent = count + ' 回称号「' + rank(count) + '」らて子「せーのぉ、よくがんばったぉ♡」';
    var qz = document.getElementById('quiz');
    qz.style.display = 'block';
    document.getElementById('qR').value = '';
    document.getElementById('qL').value = '';
    document.getElementById('qB').value = '';
    document.getElementById('quizResult').textContent = '';
    document.getElementById('btnQuiz').disabled = false;
    btn.textContent = 'もう一度';
    btn.disabled = false;
  }

  btn.addEventListener('click', function(){
    if (playing) return;
    count = 0; wink = false;
    cntR = 0; cntL = 0; cntB = 0;
    document.getElementById('quiz').style.display = 'none';
    elCount.textContent = '0';
    elMsg.textContent = 'いくよせーのぉ';
    endAt = Date.now() + 10000;
    playing = true;
    btn.disabled = true;
    btn.textContent = '対決中…';
    tickTimer = setInterval(function(){
      var remain = endAt - Date.now();
      if (remain <= 0) { finish(); return; }
      elTime.style.width = (remain / 100) + '%';
    }, 50);
  });

  document.getElementById('faceBtn').addEventListener('pointerdown', function(e){
    e.preventDefault();
    if (!playing) return;
    count++;
    elCount.textContent = count;
    wink = !wink;
    if (wink) {
      var r = Math.random();
      if (r < 0.4) { face.src = IMG_WINK; face.style.transform = ''; cntL++; }
      else if (r < 0.8) { face.src = IMG_WINK; face.style.transform = 'scaleX(-1)'; cntR++; }
      else { face.src = IMG_BOTH; face.style.transform = ''; cntB++; }
    } else {
      face.src = IMG_OPEN; face.style.transform = '';
    }
  });
  document.getElementById('btnQuiz').addEventListener('click', function(){
    function val(id){ var v = parseInt(document.getElementById(id).value, 10); return isNaN(v) ? -1 : v; }
    var aR = val('qR'), aL = val('qL'), aB = val('qB');
    function part(name, ans, real){
      return name + '：' + (ans === real ? '正解（' + real + '回）' : 'はずれ（正解は' + real + '回）');
    }
    var txt = part('右目', aR, cntR) + '／' + part('左目', aL, cntL) + '／' + part('両目', aB, cntB);
    if (aR === cntR && aL === cntL && aB === cntB) txt += '　全問正解！らて子「すごいぉ、よく見てたぉ♡」';
    document.getElementById('quizResult').textContent = txt;
    document.getElementById('btnQuiz').disabled = true;
  });
})();
