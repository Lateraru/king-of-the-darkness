var DESCS = {
  first: "普通免許などの一種免許に向けた問題です<br>標識・速度・追い越し・駐停車などの基本が中心です",

};
function $(id){ return document.getElementById(id); }
var setKey = 'first', quiz = [], qi = 0, score = 0, answered = false;
function showBest(){
  try {
    var bests = JSON.parse(localStorage.getItem('maouGakkaBest') || '{}');
    $('bestLine').textContent = bests[setKey] != null ? 'ベスト：10問中 ' + bests[setKey] + ' 問正解' : '';
  } catch (e) { $('bestLine').textContent = ''; }
}
document.querySelectorAll('.sbtn2[data-s]').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.sbtn2[data-s]').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); setKey = b.dataset.s;
    $('setDesc').innerHTML = DESCS[setKey];
    $('startBox').style.display = 'block';
    $('quizBox').style.display = 'none';
    $('resultBox').style.display = 'none';
    showBest();
  });
});
function startQuiz(){
  var bank = BANK[setKey].slice();
  for (var i = bank.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = bank[i]; bank[i] = bank[j]; bank[j] = tmp;
  }
  quiz = bank.slice(0, 10);
  qi = 0; score = 0;
  $('startBox').style.display = 'none';
  $('resultBox').style.display = 'none';
  $('quizBox').style.display = 'block';
  showQuestion();
}
function showQuestion(){
  answered = false;
  $('prog').textContent = '第 ' + (qi + 1) + ' 問 / 10';
  $('scoreNow').textContent = score;
  $('qText').textContent = quiz[qi][0];
  $('expBox').style.display = 'none';
  $('btnMaru').disabled = false;
  $('btnBatsu').disabled = false;
}
function answer(val){
  if (answered) return;
  answered = true;
  var correct = quiz[qi][1] === val;
  if (correct) score++;
  $('scoreNow').textContent = score;
  $('btnMaru').disabled = true;
  $('btnBatsu').disabled = true;
  var box = $('expBox');
  box.className = correct ? 'exp' : 'exp ng';
  $('expHead').innerHTML = correct ? '<span class="ok">⭕ 正解です</span>' : '<span class="warn">❌ 不正解です　正解は「' + (quiz[qi][1] ? '○' : '×') + '」</span>';
  $('expText').innerHTML = '<b>💡 一言アドバイス</b><br>' + quiz[qi][2];
  $('btnNext').textContent = qi >= 9 ? '結果を見る ▶' : '次へ ▶';
  box.style.display = 'block';
}
$('btnStart').addEventListener('click', startQuiz);
$('btnRetry').addEventListener('click', startQuiz);
$('btnMaru').addEventListener('click', function(){ answer(true); });
$('btnBatsu').addEventListener('click', function(){ answer(false); });
$('btnNext').addEventListener('click', function(){
  qi++;
  if (qi >= 10){
    $('quizBox').style.display = 'none';
    var grade = score >= 10 ? '満点です！　免許証級の理解です' : score >= 9 ? '合格圏内です　本試験でもこの調子で' : score >= 7 ? 'あと少し　解説を読み直すと伸びます' : score >= 5 ? '基礎を固め直すと一気に伸びます' : 'まずは教本の基本から復習しましょう';
    $('resultText').innerHTML = (setKey === 'first' ? '一種用' : '二種用') + '　10問中 <b>' + score + ' 問</b> 正解<br>' + grade + '<br><span class="small">本試験の合格ラインは9割が目安です</span>';
    $('resultBox').style.display = 'block';
    try {
      var bests = JSON.parse(localStorage.getItem('maouGakkaBest') || '{}');
      if (bests[setKey] == null || score > bests[setKey]){ bests[setKey] = score; localStorage.setItem('maouGakkaBest', JSON.stringify(bests)); }
    } catch (e) {}
    showBest();
  } else showQuestion();
});
showBest();
</script>

</html>
