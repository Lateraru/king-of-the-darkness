<script>
(function(){
  "use strict";
  var pads = Array.prototype.slice.call(document.querySelectorAll('.pad'));
  var elLevel = document.getElementById('level'), elBest = document.getElementById('best'), elMsg = document.getElementById('msg');
  var btn = document.getElementById('btnStart');
  var elFace = document.getElementById('faceMsg');
  var FREQS = [392, 523, 659, 784];
  var audioCtx = null;

  var best = 0;
  try { best = parseInt(localStorage.getItem('maouSimonBest') || '0', 10) || 0; } catch(e) {}
  elBest.textContent = best;

  var seq = [], inputIdx = 0, accepting = false, playing = false;

  function beep(i){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = FREQS[i];
      o.type = 'sine';
      g.gain.setValueAtTime(0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.26);
    } catch(e) {}
  }

  function light(i, ms){
    pads[i].classList.add('lit');
    beep(i);
    setTimeout(function(){ pads[i].classList.remove('lit'); }, ms);
  }

  function playSeq(){
    accepting = false;
    elMsg.textContent = 'よく見て…';
    var stepMs = Math.max(240, 470 - seq.length * 14);
    seq.forEach(function(v, idx){
      setTimeout(function(){ light(v, stepMs * 0.72); }, 420 + idx * stepMs);
    });
    setTimeout(function(){
      accepting = true;
      inputIdx = 0;
      elMsg.textContent = 'あなたの番同じ順に唱えて';
    }, 420 + seq.length * stepMs + 120);
  }

  function nextLevel(){
    seq.push(Math.floor(Math.random() * 4));
    elLevel.textContent = seq.length;
    playSeq();
  }

  function gameOver(){
    playing = false;
    showOverNav();
    accepting = false;
    var lv = seq.length - 1;
    if (lv > best) {
      best = lv; elBest.textContent = best;
      try { localStorage.setItem('maouSimonBest', String(best)); } catch(e) {}
    }
    elMsg.textContent = '詠唱失敗レベル ' + lv + ' まで到達';
    elFace.textContent = '😖 らて子「ああっ、ちがうぉ」らてらる「また挑戦すればよい」';
    btn.textContent = 'もう一度';
    btn.disabled = false;
  }

  pads.forEach(function(p){
    p.addEventListener('click', function(){
      if (!accepting || !playing) return;
      var i = parseInt(p.dataset.i, 10);
      light(i, 200);
      if (i === seq[inputIdx]) {
        inputIdx++;
        if (inputIdx >= seq.length) {
          accepting = false;
          elFace.textContent = '😊 らてらる「正解だ見事だな」らて子「すごいぉ♡」';
          elMsg.textContent = '正解次の詠唱へ';
          setTimeout(nextLevel, 750);
        }
      } else {
        gameOver();
      }
    });
  });

  btn.addEventListener('click', function(){
    if (playing) return;
    playing = true;
    seq = [];
    elLevel.textContent = '0';
    btn.disabled = true;
    btn.textContent = '詠唱中…';
    elFace.textContent = '😐 らてらる「詠唱開始だ集中しろ」';
    nextLevel();
  });
})();
</script>

/* 人気カウンター: デプロイ時に STATS_BASE へ接続先を設定（それまでは何もしません） */
(function(){
  var STATS_BASE = '';
  if (!STATS_BASE) return;
  try {
    var slug = 'simon';
    var today = new Date().toLocaleDateString('sv-SE');
    var seen = {};
    try { seen = JSON.parse(localStorage.getItem('maouHitV1') || '{}'); } catch (e) {}
    if (seen[slug] === today) return;
    seen[slug] = today;
    try { localStorage.setItem('maouHitV1', JSON.stringify(seen)); } catch (e) {}
    fetch(STATS_BASE + '/api/hit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: slug }), keepalive: true }).catch(function(){});
  } catch (e) {}
})();
</script>
