<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>魔王ブレイブ 試作版｜魔王らてらる・魔王らて子のファンサイト</title>
<meta name="description" content="ファンサイトの新作ゲーム試作版　フィールドでザコと戦い、奥のボス「鉄の巨人」に挑む、仲間と共に戦うアクションRPG">
<style>
:root{--ink:#2b2135;--paper:#fdf8ee;--accent:#7a4fd0;--gold:#c9962e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#171021;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:10px 10px 26px}
h1{font-size:19px;color:#f3e9ff;text-align:center;margin:8px 0 2px;letter-spacing:.06em}
.sub{color:#cbb8ec;text-align:center;font-size:12px;margin:0 0 10px}
.stage{position:relative;background:#241733;border-radius:14px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#3d6b35;touch-action:none}
.hud{display:flex;gap:6px;margin:8px 0 0}
.party{flex:1;background:var(--paper);border-radius:10px;padding:6px 8px;font-size:11px;line-height:1.5}
.party .nm{font-weight:700}
.bar{height:7px;background:#e4d9c8;border-radius:4px;overflow:hidden;margin:1px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#58b368,#8fd07a);border-radius:4px}
.bar.low i{background:linear-gradient(90deg,#d05858,#e08a7a)}
.mp i{background:linear-gradient(90deg,#4f7fd0,#7ab3e8)}
.down{opacity:.45}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
button{font-family:inherit;border:none;border-radius:10px;padding:10px 8px;font-size:13px;font-weight:700;background:var(--paper);color:var(--ink);box-shadow:0 2px 0 #cbbfa5;cursor:pointer;flex:1;min-width:100px}
button:active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.45;cursor:default}
button.skill{background:#efe6ff;box-shadow:0 2px 0 #b49ae0}
button.gauge{background:#ffe9a8;box-shadow:0 2px 0 #d8ae4e}
button.gauge.full{background:#ffd94d;animation:pulse 0.8s infinite alternate}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.18)}}
button.stance{flex:0 1 auto;min-width:86px;font-size:11px;padding:8px 6px}
.msg{background:var(--paper);border-radius:10px;padding:9px 11px;margin-top:8px;font-size:13px;line-height:1.7;min-height:44px;white-space:pre-wrap}
.note{color:#cbb8ec;font-size:11px;line-height:1.7;margin-top:10px}
.bossbar{display:none;background:var(--paper);border-radius:10px;padding:6px 8px;margin-top:8px;font-size:11px}
.bossbar .bar i{background:linear-gradient(90deg,#b03a3a,#e07a5f)}
.bossbar .arm i{background:linear-gradient(90deg,#7a6a55,#a89372)}
</style>
</head>
<body>
<div class="wrap">
<h1>魔王ブレイブ 試作版</h1>
<p class="sub">フィールドで戦い、奥のボスに挑む試作版です</p>
<div class="stage">
<canvas id="cv" width="540" height="720"></canvas>
</div>
<div class="hud">
  <div class="party" id="p0"></div>
  <div class="party" id="p1"></div>
  <div class="party" id="p2"></div>
</div>
<div class="bossbar" id="bossbar"></div>
<div class="row">
  <button class="skill" id="btnSlash">魔剣連斬</button>
  <button class="skill" id="btnPotion">やくそう ×3</button>
  <button class="gauge" id="btnGauge">魔王の裁き</button>
</div>
<div class="row">
  <button class="stance" id="btnStance1">星狼：バランス</button>
  <button class="stance" id="btnStance2">ぎゅーたん：バランス</button>
  <button class="stance" id="btnRetry">はじめから</button>
</div>
<div class="msg" id="msg"></div>
<p class="note">あそび方：画面をタップすると、主人公がそこへ歩きます　近くの敵とは自動で戦います　星狼さんとぎゅーたんさんは仲間のNPCで、自動で助けてくれます　北の門の先にボス「鉄の巨人」がいます</p>
</div>
<script>
"use strict";
/* ===== 魔王ブレイブ試作版 =====
   フィールド（聖剣伝説式ザコ戦）＋ボス戦（ピグブレイブ式アリーナ）
   プレイヤーは主人公のみ操作。星狼・ぎゅーたんはNPC仲間 */
var W = 540, H = 720;
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

/* ---------- 共通セーブ（ラテ） ---------- */
var SAVE_KEY = 'maouSharedSaveV1';
function loadShared(){
  try{ var s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if(s && s.wallet && typeof s.wallet.late === 'number') return s; }catch(e){}
  return {version:1, playerId:'guest', updatedAt:0, wallet:{late:0}, items:[], flags:{}};
}
function addLate(n){
  if(!n) return;
  var s = loadShared(); s.wallet.late += n; s.updatedAt = Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){}
  G.late += n;
}
function getLate(){ var s = loadShared(); return s.wallet.late; }

/* ---------- ゲーム状態 ---------- */
var WORLD_W = 1680, WORLD_H = 1320, TILE = 40;
var GATE = {x: WORLD_W/2, y: 66, r: 52};
var G = null;
function newMember(kind, name, x, y, hp, atk, range, interval, speed){
  return {kind:kind, name:name, x:x, y:y, hp:hp, maxhp:hp, mp:30, maxmp:30,
    atk:atk, range:range, interval:interval, speed:speed, cd:0, down:false,
    tx:x, ty:y, face:1, walk:0, invuln:0, focus:null, stance:1};
}
function freshGame(){
  G = {
    mode:'field', t:0, over:false, clear:false, started:false,
    cam:{x:0,y:0}, late: getLate(), coins:0, kills:0,
    player: newMember('player','ゲスト', WORLD_W/2, WORLD_H-180, 130, 11, 48, 0.55, 158),
    sero:   newMember('sero','星狼', WORLD_W/2-70, WORLD_H-140, 95, 8, 138, 0.9, 150),
    gyutan: newMember('gyutan','ぎゅーたん', WORLD_W/2+70, WORLD_H-140, 150, 13, 54, 0.7, 150),
    mobs:[], parts:[], floats:[],
    potions:3, gauge:0,
    slashCd:0, reading:0, readingCd:0, circle:null, circleCd:0, sweepCd:0,
    rewindCharge:1, rewind:null,
    boss:null, focusTarget:null,
    msgTimer:0, introStep:0, shake:0
  };
  G.sero.stance = 1; G.gyutan.stance = 1;
  spawnFieldMobs();
  setMsg('魔王らてらる「よく来たな、ゲスト\n北の森に鉄の巨人が出た\n星狼とぎゅーたんを連れて、様子を見てきてほしい」');
}
function party(){ return [G.player, G.sero, G.gyutan]; }
function aliveParty(){ return party().filter(function(m){ return !m.down; }); }

/* ---------- メッセージ ---------- */
var msgEl = document.getElementById('msg');
function setMsg(t){ msgEl.textContent = t; G.msgTimer = 6; }

/* ---------- フィールドのザコ ---------- */
var MOB_TYPES = {
  slime:   {name:'スライム',   hp:30, atk:5,  speed:52,  range:30, interval:1.15, coins:6,  r:17, col:'#69c24f'},
  ghost:   {name:'ゴースト',   hp:22, atk:7,  speed:96,  range:30, interval:1.0,  coins:8,  r:15, col:'#e8e6f2'},
  cerberus:{name:'ケルベロス', hp:74, atk:10, speed:70,  range:34, interval:1.2,  coins:15, r:20, col:'#a5713f'}
};
function spawnMob(kind, x, y){
  var t = MOB_TYPES[kind];
  G.mobs.push({kind:kind, name:t.name, x:x, y:y, hp:t.hp, maxhp:t.hp, atk:t.atk,
    speed:t.speed, range:t.range, interval:t.interval, coins:t.coins, r:t.r,
    cd:Math.random()*0.5, wx:x, wy:y, wt:0, face:1, walk:0, flash:0});
}
function spawnFieldMobs(){
  var spots = [
    ['slime',300,980],['slime',520,900],['ghost',1150,940],['slime',840,760],
    ['ghost',420,640],['cerberus',1240,620],['slime',700,520],['ghost',1020,430],
    ['cerberus',560,330],['slime',900,250],['ghost',1180,240],['cerberus',840,470]
  ];
  for(var i=0;i<spots.length;i++) spawnMob(spots[i][0], spots[i][1], spots[i][2]);
}
/* 木（障害物） */
var TREES = [];
(function(){ var seed=7; function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
  for(var i=0;i<70;i++){ var x=60+rnd()*(WORLD_W-120), y=120+rnd()*(WORLD_H-260);
    if(Math.abs(x-WORLD_W/2)<110 && y>180) continue;
    if(Math.hypot(x-GATE.x,y-GATE.y)<130) continue;
    TREES.push({x:x,y:y,r:20+rnd()*10}); }
})();
function collide(x, y, r){
  if(x<r) x=r; if(y<r) y=r; if(x>WORLD_W-r) x=WORLD_W-r; if(y>WORLD_H-r) y=WORLD_H-r;
  for(var i=0;i<TREES.length;i++){ var t=TREES[i];
    var d=Math.hypot(x-t.x,y-t.y), min=r+t.r*0.55;
    if(d<min && d>0.01){ x=t.x+(x-t.x)/d*min; y=t.y+(y-t.y)/d*min; }
  }
  return {x:x, y:y};
}
/* ---------- 入力（タップ移動） ---------- */
var pointer = {down:false, sx:0, sy:0};
function canvasPos(ev){
  var r = cv.getBoundingClientRect();
  var cx = (ev.touches ? ev.touches[0].clientX : ev.clientX);
  var cy = (ev.touches ? ev.touches[0].clientY : ev.clientY);
  return {x:(cx-r.left)/r.width*W, y:(cy-r.top)/r.height*H};
}
var QV = 0.78, BOSS_OY = 30;
function toWorld(p){
  if(G && G.mode === 'boss') return {x:p.x, y:(p.y - BOSS_OY)/QV};
  return {x:p.x + (G ? G.cam.x : 0), y:p.y/QV + (G ? G.cam.y : 0)};
}
function vx(x){ return G.mode === 'boss' ? x : x - G.cam.x; }
function vy(y){ return G.mode === 'boss' ? y*QV + BOSS_OY : (y - G.cam.y)*QV; }
function groundTransform(){
  if(G.mode === 'boss') ctx.transform(1, 0, 0, QV, 0, BOSS_OY);
  else ctx.transform(1, 0, 0, QV, -G.cam.x, -G.cam.y*QV);
}
cv.addEventListener('pointerdown', function(ev){
  ev.preventDefault(); pointer.down = true;
  var w = toWorld(canvasPos(ev)); tapAt(w.x, w.y);
});
cv.addEventListener('pointermove', function(ev){
  if(!pointer.down) return;
  var w = toWorld(canvasPos(ev));
  if(G && G.mode==='field'){ G.player.tx = w.x; G.player.ty = w.y; }
  else if(G && G.mode==='boss'){ G.playerMove = {x:w.x, y:w.y}; }
});
window.addEventListener('pointerup', function(){ pointer.down = false; });
function tapAt(wx, wy){
  if(!G || G.over || G.clear) return;
  if(G.mode==='boss'){
    /* ボス戦：部位タップで集中攻撃先を切り替える */
    var b = G.boss;
    if(b && !b.dead){
      var targets = bossTargets();
      for(var i=0;i<targets.length;i++){ var t = targets[i];
        if(Math.hypot(wx-t.x, wy-t.y) < t.r+18){ G.focusTarget = t.id; G.playerMove = null; setMsg('集中攻撃：'+t.label); return; }
      }
    }
    G.playerMove = {x:wx, y:wy}; return;
  }
  /* フィールド：敵タップで集中先、地面タップで移動 */
  for(var j=0;j<G.mobs.length;j++){ var m = G.mobs[j];
    if(Math.hypot(wx-m.x, wy-m.y) < m.r+20){ G.player.focus = m; G.focusTarget = null; return; }
  }
  G.player.focus = null;
  G.player.tx = wx; G.player.ty = wy;
}

/* ---------- ユーティリティ ---------- */
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function moveToward(m, tx, ty, dt, speedMul){
  var dx = tx-m.x, dy = ty-m.y, d = Math.hypot(dx,dy);
  var sp = m.speed*(speedMul||1);
  if(d < 4){ m.walk = 0; return true; }
  var step = Math.min(d, sp*dt);
  var nx = m.x + dx/d*step, ny = m.y + dy/d*step;
  if(G.mode==='field'){ var c = collide(nx, ny, 14); nx = c.x; ny = c.y; }
  else { nx = Math.max(24, Math.min(W-24, nx)); ny = Math.max(120, Math.min(H-24, ny)); }
  m.face = dx >= 0 ? 1 : -1;
  m.x = nx; m.y = ny; m.walk += dt*9;
  return d-step < 6;
}
function addFloat(x, y, text, col){ G.floats.push({x:x, y:y, text:text, col:col||'#fff', t:0}); }
function addPart(x, y, col, n){ for(var i=0;i<(n||6);i++){ var a=Math.random()*Math.PI*2, s=30+Math.random()*70;
  G.parts.push({x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-30, t:0, col:col, r:2+Math.random()*3}); } }
function gainGauge(v){ G.gauge = Math.min(100, G.gauge+v); }

/* ---------- ダメージ ---------- */
function hurtMember(m, dmg, srcName){
  if(m.down || m.invuln > 0 || G.over) return;
  if(G.circle && dist(m, G.circle) < G.circle.r){ dmg = Math.round(dmg*0.45); }
  m.hp -= dmg; gainGauge(0.8);
  addFloat(m.x, m.y-30, '-'+dmg, '#ff9a8a'); addPart(m.x, m.y, '#e0584f', 4);
  if(m.hp <= 0){ m.hp = 0; m.down = true;
    setMsg(m.name+'が倒れた');
    checkPartyDown();
  }
}
function checkPartyDown(){
  if(G.player.down && G.gyutan.down && G.sero.down){ gameOver(); return; }
  if(G.player.down && G.gyutan.down && !G.sero.down){ maybeStartRewind(); }
}
function gameOver(){
  if(G.over) return; G.over = true;
  setMsg('全員倒れてしまった\n魔王城へ運ばれていきました');
}
function healMember(m, v){
  if(m.down) return;
  m.hp = Math.min(m.maxhp, m.hp+v);
  addFloat(m.x, m.y-30, '+'+v, '#8fe08a');
}

/* ---------- 時戻しの懐中時計 ---------- */
function maybeStartRewind(){
  if(G.rewind || G.rewindCharge <= 0 || G.sero.down || G.over) return;
  G.rewind = {t:0, need:3.0};
  setMsg('星狼「まだ終わらせない　時よ、戻れ」\n星狼が倒れずに3秒耐えれば、2人が完全復活します');
}
function stepRewind(dt){
  if(!G.rewind) return;
  if(G.sero.down){ G.rewind = null; setMsg('星狼が倒れた　時戻しは失敗した'); checkPartyDown(); return; }
  G.rewind.t += dt;
  if(G.rewind.t >= G.rewind.need){
    G.rewind = null; G.rewindCharge--;
    var p = G.player, g = G.gyutan;
    p.down = false; p.hp = p.maxhp; p.mp = p.maxmp; p.x = G.sero.x-44; p.y = G.sero.y+18; p.tx = p.x; p.ty = p.y; p.invuln = 2;
    g.down = false; g.hp = g.maxhp; g.mp = g.maxmp; g.x = G.sero.x+44; g.y = G.sero.y+18; g.tx = g.x; g.ty = g.y; g.invuln = 2;
    addPart(p.x, p.y, '#ffe98a', 16); addPart(g.x, g.y, '#ffe98a', 16);
    setMsg('時が戻った　ゲストとぎゅーたんが完全復活した');
  }
}

/* ---------- 仲間AIと得意技 ---------- */
function nearestMob(x, y, maxD){
  var best=null, bd=maxD||1e9;
  for(var i=0;i<G.mobs.length;i++){ var m=G.mobs[i]; var d=Math.hypot(m.x-x,m.y-y); if(d<bd){ bd=d; best=m; } }
  return best;
}
function memberAttack(m, target, dt){
  m.cd -= dt;
  if(!target) return;
  var d = dist(m, target);
  if(d > m.range){ moveToward(m, target.x, target.y, dt); return; }
  m.walk = 0;
  m.face = target.x >= m.x ? 1 : -1;
  if(m.cd <= 0){
    m.cd = m.interval;
    var crit = Math.random() < (G.reading > 0 ? 0.25 : 0.10);
    var dmg = Math.round(m.atk * (0.9+Math.random()*0.25) * (crit?1.8:1));
    hitEnemy(target, dmg, m);
    if(crit) addFloat(target.x, target.y-34, '会心', '#ffd94d');
    if(m.kind==='gyutan') gyutanSweepCheck(target);
  }
}
function hitEnemy(e, dmg, from){
  e.hp -= dmg; e.flash = 0.12; gainGauge(0.35);
  addFloat(e.x+(Math.random()*16-8), e.y-e.r-8, ''+dmg, '#fff');
  if(e.hp <= 0 && G.mode==='field') killMob(e);
}
function killMob(m){
  var i = G.mobs.indexOf(m); if(i>=0) G.mobs.splice(i,1);
  G.kills++; G.coins += m.coins; addLate(m.coins);
  addFloat(m.x, m.y-20, m.coins+'ラテ', '#ffd94d'); addPart(m.x, m.y, '#ffe98a', 10);
  if(G.player.focus === m) G.player.focus = null;
}
function gyutanSweepCheck(mainTarget){
  if(G.sweepCd > 0) return;
  var near = 0, i, e;
  var list = G.mode==='field' ? G.mobs : [];
  for(i=0;i<list.length;i++){ if(dist(G.gyutan, list[i]) < 78) near++; }
  if(G.mode==='boss' && G.boss && !G.boss.dead) near = 2;
  if(near >= 2){
    G.sweepCd = 12;
    setMsg('ぎゅーたん「魂刈り」　大鎌が周囲を薙ぎ払った');
    addPart(G.gyutan.x, G.gyutan.y, '#c9a7ff', 14);
    for(i=0;i<list.length;i++){ e = list[i];
      if(dist(G.gyutan, e) < 82){ hitEnemy(e, 30, G.gyutan);
        var d = Math.max(1, dist(G.gyutan, e));
        e.x += (e.x-G.gyutan.x)/d*26; e.y += (e.y-G.gyutan.y)/d*26; } }
    if(G.mode==='boss') bossHit(bossBodyTarget(), 30, G.gyutan);
  }
}
function stepSkills(dt){
  /* 星読みの導き：星狼が自動発動（持続20秒、再発動まで28秒） */
  if(G.reading > 0) G.reading -= dt;
  if(G.readingCd > 0) G.readingCd -= dt;
  var inCombat = (G.mode==='boss' && G.boss && !G.boss.dead) || nearestMob(G.sero.x, G.sero.y, 260);
  if(!G.sero.down && G.reading <= 0 && G.readingCd <= 0 && inCombat){
    G.reading = 20; G.readingCd = 28;
    setMsg('星狼「星読みの導き」　敵の動きと危険な場所が見えるようになった');
  }
  /* 戦乙女の守護陣：星狼か主人公の危機で、ぎゅーたんが張る */
  if(G.circle){ G.circle.t -= dt;
    party().forEach(function(m){ if(!m.down && dist(m, G.circle) < G.circle.r) healMember(m, 4*dt); });
    if(G.circle.t <= 0) G.circle = null;
  }
  if(G.circleCd > 0) G.circleCd -= dt;
  if(G.sweepCd > 0) G.sweepCd -= dt;
  if(!G.gyutan.down && !G.circle && G.circleCd <= 0){
    var th = G.gyutan.stance===2 ? 0.55 : (G.gyutan.stance===0 ? 0.25 : 0.40);
    var thP = G.gyutan.stance===2 ? 0.45 : (G.gyutan.stance===0 ? 0.18 : 0.30);
    if((!G.sero.down && G.sero.hp < G.sero.maxhp*th) || G.player.hp < G.player.maxhp*thP){
      if(inCombat){
        G.circle = {x:G.gyutan.x, y:G.gyutan.y, r:96, t:9};
        G.circleCd = 25;
        setMsg('ぎゅーたん「戦乙女の守護陣」　陣の中は安全です　近くへ避難を');
      }
    }
  }
}
function stepCompanion(m, dt, anchorOff){
  if(m.down) return;
  /* ボス戦：予告エリアの上にいる仲間は自分で避ける */
  if(G.mode==='boss' && G.boss){
    var teles = G.boss.teles;
    for(var ti=0; ti<teles.length; ti++){ var tg = teles[ti];
      if(Math.hypot(m.x-tg.x, m.y-tg.y) < tg.r + 6){
        var dd = Math.max(1, Math.hypot(m.x-tg.x, m.y-tg.y));
        moveToward(m, tg.x + (m.x-tg.x)/dd*(tg.r+36), tg.y + (m.y-tg.y)/dd*(tg.r+36), dt, 1.25);
        return;
      }
    }
  }
  /* 守護陣がある時は、星狼は陣へ退避する */
  if(m.kind==='sero' && G.circle && m.hp < m.maxhp*0.55 && dist(m, G.circle) > G.circle.r*0.5){
    moveToward(m, G.circle.x, G.circle.y, dt); return;
  }
  var target = null;
  if(G.mode==='field'){
    target = (m.kind==='gyutan' && G.player.focus) ? G.player.focus : nearestMob(m.x, m.y, m.stance===0 ? 300 : 230);
    if(!target){
      var ax = G.player.x + anchorOff.x, ay = G.player.y + anchorOff.y;
      if(Math.hypot(m.x-ax, m.y-ay) > 26) moveToward(m, ax, ay, dt); else m.walk = 0;
      return;
    }
    memberAttack(m, target, dt);
  } else {
    bossCompanion(m, dt, anchorOff);
  }
}
/* ---------- フィールドの進行 ---------- */
function stepMobs(dt){
  for(var i=G.mobs.length-1;i>=0;i--){ var m = G.mobs[i];
    if(m.flash > 0) m.flash -= dt;
    var tgt = null, td = 195;
    aliveParty().forEach(function(p){ var d = dist(m, p); if(d < td){ td = d; tgt = p; } });
    m.cd -= dt;
    if(tgt){
      if(td > m.range){
        var dx = tgt.x-m.x, dy = tgt.y-m.y, d = Math.max(1, Math.hypot(dx,dy));
        var nx = m.x + dx/d*m.speed*dt, ny = m.y + dy/d*m.speed*dt;
        var c = collide(nx, ny, m.r); m.x = c.x; m.y = c.y; m.face = dx>=0?1:-1; m.walk += dt*8;
      } else if(m.cd <= 0){ m.cd = m.interval; hurtMember(tgt, m.atk, m.name); }
    } else {
      m.wt -= dt;
      if(m.wt <= 0){ m.wt = 2+Math.random()*2; m.wx = m.x+(Math.random()*120-60); m.wy = m.y+(Math.random()*120-60); }
      var dx2 = m.wx-m.x, dy2 = m.wy-m.y, d2 = Math.hypot(dx2,dy2);
      if(d2 > 6){ var nx2 = m.x + dx2/d2*m.speed*0.4*dt, ny2 = m.y + dy2/d2*m.speed*0.4*dt;
        var c2 = collide(nx2, ny2, m.r); m.x = c2.x; m.y = c2.y; m.walk += dt*5; }
    }
  }
}
function stepPlayerField(dt){
  var p = G.player; if(p.down) return;
  p.cd -= dt;
  var target = null;
  if(p.focus && G.mobs.indexOf(p.focus) >= 0) target = p.focus;
  if(!target) target = nearestMob(p.x, p.y, 190);
  if(target && dist(p, target) <= p.range + target.r*0.4){
    p.walk = 0; p.face = target.x >= p.x ? 1 : -1;
    if(p.cd <= 0){ p.cd = p.interval;
      var crit = Math.random() < (G.reading > 0 ? 0.25 : 0.10);
      hitEnemy(target, Math.round(p.atk*(0.9+Math.random()*0.25)*(crit?1.8:1)), p);
      if(crit) addFloat(target.x, target.y-34, '会心', '#ffd94d');
    }
    return;
  }
  if(target && p.focus){ moveToward(p, target.x, target.y, dt); return; }
  if(Math.hypot(p.tx-p.x, p.ty-p.y) > 8) moveToward(p, p.tx, p.ty, dt); else p.walk = 0;
}
function stepField(dt){
  stepPlayerField(dt);
  stepCompanion(G.sero, dt, {x:-66, y:34});
  stepCompanion(G.gyutan, dt, {x:66, y:34});
  stepMobs(dt);
  if(!G.over && dist(G.player, GATE) < 48) enterBoss();
  var VH = H/QV;
  G.cam.x = Math.max(0, Math.min(WORLD_W-W, G.player.x - W/2));
  G.cam.y = Math.max(0, Math.min(WORLD_H-VH, G.player.y - VH/2));
}

/* ---------- ボス戦（鉄の巨人） ---------- */
function enterBoss(){

    atkT:2.2, stun:0, rage:0, firstBroken:null, teles:[], rings:[], walk:0 };
  setMsg('鉄の巨人「…マズハ　ミギウデ　ツイデ　ヒダリウデ\n順ニ　ヘシ折ッテ　ミセヨ」\n腕をタップすると集中攻撃先を変えられます');
}
function bossTargets(){
  var b = G.boss; if(!b) return [];
  var out = [];
  if(!b.armR.broken) out.push({id:'armR', label:'右腕', x:b.x-86, y:b.y+16, r:34});
  if(!b.armL.broken) out.push({id:'armL', label:'左腕', x:b.x+86, y:b.y+16, r:34});
  out.push({id:'body', label:'胴体', x:b.x, y:b.y+4, r:56});
  return out;
}
function bossBodyTarget(){ return {id:'body', label:'胴体', x:G.boss.x, y:G.boss.y+4, r:56}; }
function currentFocusPoint(){
  var ts = bossTargets();
  for(var i=0;i<ts.length;i++) if(ts[i].id === G.focusTarget) return ts[i];
  G.focusTarget = ts[0].id; return ts[0];
}
function bossHit(t, dmg, from){
  var b = G.boss; if(!b || b.dead) return;
  if(t.id === 'armR' || t.id === 'armL'){
    var arm = t.id === 'armR' ? b.armR : b.armL;
    if(arm.broken){ bossHit(bossBodyTarget(), dmg, from); return; }
    arm.hp -= dmg; gainGauge(0.35);
    addFloat(t.x+(Math.random()*14-7), t.y-30, ''+dmg, '#fff');
    if(arm.hp <= 0) breakArm(t.id);
  } else {
    var red = (b.armR.broken && b.armL.broken) ? 1 : 0.55;
    var d2 = Math.max(1, Math.round(dmg*red));
    b.hp -= d2; gainGauge(0.35);
    addFloat(b.x+(Math.random()*36-18), b.y-88, ''+d2, '#fff');
    if(b.hp <= 0) bossDie();
  }
}
function breakArm(id){
  var b = G.boss;
  var arm = id === 'armR' ? b.armR : b.armL;
  arm.broken = true; arm.hp = 0;
  addPart(id === 'armR' ? b.x-86 : b.x+86, b.y+16, '#ffb35c', 18);
  G.shake = 0.35;
  if(!b.firstBroken){
    b.firstBroken = id;
    if(id === 'armR'){ b.stun = 3; gainGauge(30);
      setMsg('右腕が壊れた　順番どおりで鉄の巨人がひるんだ');
    } else { b.rage = 6;
      setMsg('左腕が先に壊れた　順番が違う　鉄の巨人が怒った');
    }
  } else {
    setMsg('両腕が壊れた　胴体のコアがむき出しになった　今が攻め時');
  }
  if(G.focusTarget === id) G.focusTarget = 'body';
}
function bossDie(){
  var b = G.boss; b.dead = true; G.clear = true;
  addPart(b.x, b.y, '#ffd94d', 30); addPart(b.x, b.y, '#ffb35c', 20);
  addLate(300); G.coins += 300;
  setMsg('鉄の巨人を倒した　試作版クリアです\n倒したザコとボスのぶん、ラテが共通のお財布に入りました');
}
function bossAttack(){
  var b = G.boss;
  var alive = aliveParty(); if(!alive.length) return;
  var lead = G.reading > 0 ? 1.9 : 1.1;
  if(b.armR.broken && b.armL.broken){
    b.rings.push({r:20, hit:{}});
    addFloat(b.x, b.y-100, '震撃', '#ff9a8a');
    return;
  }
  var near = 0;
  alive.forEach(function(m){ if(dist(m, b) < 138) near++; });
  if(near >= 2 && Math.random() < 0.55){
    b.teles.push({kind:'sweep', x:b.x, y:b.y, r:140, t:lead*0.8, lead:lead*0.8, dmg:20});
  } else {
    var tgt = alive[Math.floor(Math.random()*alive.length)];
    b.teles.push({kind:'slam', x:tgt.x, y:tgt.y, r:86, t:lead, lead:lead, dmg:26});
  }
}
function stepBossEntity(dt){
  var b = G.boss; if(!b || b.dead) return;
  var i, tg;
  for(i=b.teles.length-1;i>=0;i--){ tg = b.teles[i]; tg.t -= dt;
    if(tg.t <= 0){ b.teles.splice(i,1); G.shake = 0.25;
      aliveParty().forEach(function(m){ if(dist(m, tg) < tg.r) hurtMember(m, tg.dmg, '鉄の巨人'); });
      addPart(tg.x, tg.y, '#c9b8a6', 10);
    }
  }
  for(i=b.rings.length-1;i>=0;i--){ var rg = b.rings[i]; rg.r += 215*dt;
    aliveParty().forEach(function(m){ var key = m.kind;
      if(!rg.hit[key] && Math.abs(dist(m, b) - rg.r) < 24){ rg.hit[key] = 1; hurtMember(m, 16, '鉄の巨人'); } });
    if(rg.r > 620) b.rings.splice(i,1);
  }
  if(b.stun > 0){ b.stun -= dt; return; }
  if(b.rage > 0) b.rage -= dt;
  var tgt = null, td = 1e9;
  aliveParty().forEach(function(m){ var d = dist(b, m); if(d < td){ td = d; tgt = m; } });
  if(tgt && td > 138){
    var dx = tgt.x-b.x, dy = tgt.y-b.y, d = Math.max(1, Math.hypot(dx,dy));
    b.x += dx/d*27*dt; b.y += dy/d*27*dt; b.walk += dt*3;
    b.x = Math.max(90, Math.min(W-90, b.x)); b.y = Math.max(150, Math.min(430, b.y));
  }
  b.atkT -= dt * (b.rage > 0 ? 1.45 : 1);
  if(b.atkT <= 0){ b.atkT = (b.armR.broken && b.armL.broken) ? 3.1 : 2.6; bossAttack(); }
}
function stepPlayerBoss(dt){
  var p = G.player; if(p.down) return;
  p.cd -= dt;
  if(G.playerMove){
    if(moveToward(p, G.playerMove.x, G.playerMove.y, dt)) G.playerMove = null;
    return;
  }
  var t = currentFocusPoint(); if(!t) return;
  var d = Math.hypot(p.x-t.x, p.y-t.y);
  if(d <= p.range + t.r*0.45){
    p.walk = 0; p.face = t.x >= p.x ? 1 : -1;
    if(p.cd <= 0){ p.cd = p.interval;
      var crit = Math.random() < (G.reading > 0 ? 0.25 : 0.10);
      bossHit(t, Math.round(p.atk*(0.9+Math.random()*0.25)*(crit?1.8:1)), p);
      if(crit) addFloat(t.x, t.y-40, '会心', '#ffd94d');
    }
  } else moveToward(p, t.x, t.y, dt);
}
function bossCompanion(m, dt, off){
  if(m.down) return;
  var t = currentFocusPoint(); if(!t) return;
  m.cd -= dt;
  var d = Math.hypot(m.x-t.x, m.y-t.y);
  if(d > m.range + t.r*0.4){ moveToward(m, t.x, t.y, dt); return; }
  m.walk = 0; m.face = t.x >= m.x ? 1 : -1;
  if(m.cd <= 0){ m.cd = m.interval;
    var crit = Math.random() < (G.reading > 0 ? 0.25 : 0.10);
    bossHit(t, Math.round(m.atk*(0.9+Math.random()*0.25)*(crit?1.8:1)), m);
    if(crit) addFloat(t.x, t.y-40, '会心', '#ffd94d');
    if(m.kind === 'gyutan') gyutanSweepCheck(null);
  }
}

/* ---------- メインステップ ---------- */
function step(dt){
  if(!G) return;
  G.t += dt;
  if(G.shake > 0) G.shake -= dt;
  if(G.slashCd > 0) G.slashCd -= dt;
  if(G.msgTimer > 0) G.msgTimer -= dt;
  party().forEach(function(m){ if(m.invuln > 0) m.invuln -= dt; });
  for(var i=G.floats.length-1;i>=0;i--){ var f = G.floats[i]; f.t += dt; f.y -= 26*dt; if(f.t > 1.1) G.floats.splice(i,1); }
  for(var j=G.parts.length-1;j>=0;j--){ var q = G.parts[j]; q.t += dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 130*dt; if(q.t > 0.7) G.parts.splice(j,1); }
  if(G.over || G.clear) return;
  stepSkills(dt);
  stepRewind(dt);
  if(G.mode === 'field') stepField(dt);
  else { stepPlayerBoss(dt); stepCompanion(G.sero, dt, {x:-66, y:34}); stepCompanion(G.gyutan, dt, {x:66, y:34}); stepBossEntity(dt); }
}

    ctx.fillStyle = '#dfe3ee'; ctx.fillRect(x-13, y-12, 5, 24); ctx.fillRect(x+8, y-12, 5, 24);
    circle(x-4.5, y-12, 1.8, '#33415e'); circle(x+4.5, y-12, 1.8, '#33415e');
    ctx.strokeStyle = '#c9962e'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(x+4.5, y-12, 4.6, 0, Math.PI*2); ctx.stroke();

    ctx.fillStyle = '#5b2a6e'; ctx.fillRect(x-11, y-2, 22, 19);

    ctx.fillStyle = '#191420';
    ctx.beginPath(); ctx.moveTo(x-11, y-18); ctx.lineTo(x-6, y-27); ctx.lineTo(x-2, y-18); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+2, y-18); ctx.lineTo(x+6, y-27); ctx.lineTo(x+11, y-18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#191420'; ctx.fillRect(x-12, y-20, 24, 8);
    circle(x-4, y-11, 1.8, '#7a3fd0'); circle(x+4, y-11, 1.8, '#7a3fd0');
    ctx.strokeStyle = '#8a6d4f'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(x+13*m.face, y+14); ctx.lineTo(x+24*m.face, y-22); ctx.stroke();
    ctx.strokeStyle = '#cfd6e4'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x+24*m.face, y-22, 11, m.face>0? -0.4 : Math.PI-2.2, m.face>0? 1.9 : Math.PI+0.4, m.face<0); ctx.stroke();
  } else {
    ctx.fillStyle = '#31579e'; ctx.fillRect(x-10, y-1, 20, 18);
    ctx.fillStyle = '#f2d7c4'; ctx.beginPath(); ctx.arc(x, y-11, 11, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#6b4a2b'; ctx.beginPath(); ctx.arc(x, y-15, 11, Math.PI, Math.PI*2); ctx.fill();
    circle(x-4, y-11, 1.7, '#222'); circle(x+4, y-11, 1.7, '#222');
    ctx.strokeStyle = '#cfd6e4'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(x+11*m.face, y+8); ctx.lineTo(x+19*m.face, y-8); ctx.stroke();
  }
  if(m.down) ctx.restore();
  if(m.invuln > 0 && Math.floor(G.t*10) % 2 === 0){
    ctx.strokeStyle = 'rgba(255,233,138,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y-2, 22, 0, Math.PI*2); ctx.stroke();
  }
}
function drawMob(m){
  var x = vx(m.x), y = vy(m.y);
  var bob = Math.sin(m.walk + m.x*0.01)*2;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(x, y+m.r*0.8, m.r*0.9, 4.5, 0, 0, Math.PI*2); ctx.fill();
  if(G.reading > 0){
    ctx.strokeStyle = 'rgba(255,80,60,0.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(x, y+2, m.range+8, (m.range+8)*QV, 0, 0, Math.PI*2); ctx.stroke();
  }
  var yy = y + bob*0.5;
  var flash = m.flash > 0;
  if(m.kind === 'slime'){
    ctx.fillStyle = flash ? '#fff' : '#69c24f';

  } else {
    ctx.fillStyle = flash ? '#fff' : '#a5713f';
    ctx.beginPath(); ctx.ellipse(x, yy+2, m.r, m.r*0.7, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = flash ? '#fff' : '#a5713f';
    for(var i=-1;i<=1;i++){ ctx.beginPath(); ctx.arc(x+i*11, yy-m.r*0.55, 8, 0, Math.PI*2); ctx.fill();
      circle(x+i*11-2.5, yy-m.r*0.55, 1.4, '#2b1a08'); circle(x+i*11+2.5, yy-m.r*0.55, 1.4, '#2b1a08'); }
  }

/* 地面トランスフォームの中で呼ぶこと（円が楕円に潰れて地面に沿う） */

  ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(190,140,255,0.55)'; ctx.lineWidth = 1.4/QV;
  ctx.beginPath(); ctx.arc(c.x, c.y, c.r*0.72, G.t*0.7, G.t*0.7+Math.PI*1.5); ctx.stroke();
}
function drawCircleLabel(){
  if(!G.circle) return;
  ctx.fillStyle = '#e6d4ff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('守護陣', vx(G.circle.x), vy(G.circle.y) - G.circle.r*QV - 8);
}
function drawFloatsParts(){
  var i, q;
  for(i=0;i<G.parts.length;i++){ q = G.parts[i];
    ctx.globalAlpha = 1 - q.t/0.7; circle(vx(q.x), vy(q.y), q.r, q.col); }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  for(i=0;i<G.floats.length;i++){ var f = G.floats[i];
    ctx.globalAlpha = 1 - f.t/1.1; ctx.fillStyle = f.col;
    ctx.fillText(f.text, vx(f.x), vy(f.y)); }
  ctx.globalAlpha = 1;
}
function drawTree(t){
  var x = vx(t.x), y = vy(t.y);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(x, y+12, t.r*0.8, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5a4028'; ctx.fillRect(x-4, y-4, 8, 17);
  circle(x, y-20, t.r, '#2c5426'); circle(x-10, y-9, t.r*0.66, '#35652e'); circle(x+10, y-9, t.r*0.66, '#35652e');
}
function drawGate(){
  var x = vx(GATE.x), y = vy(GATE.y);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x, y+16, 66, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5c554e'; ctx.fillRect(x-64, y-58, 26, 78); ctx.fillRect(x+38, y-58, 26, 78);
  ctx.fillStyle = '#4a443f'; ctx.fillRect(x-70, y-70, 140, 16);
  ctx.fillStyle = '#ffd94d'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('ボスの門', x, y-82);
}
function drawField(){
  var cam = G.cam, VH = H/QV;
  ctx.fillStyle = '#2c5426'; ctx.fillRect(0, 0, W, H);
  ctx.save(); groundTransform();
  var x0 = Math.floor(cam.x/TILE), x1 = Math.ceil((cam.x+W)/TILE);
  var y0 = Math.floor(cam.y/TILE), y1 = Math.ceil((cam.y+VH)/TILE);
  for(var ty=y0; ty<=y1; ty++) for(var tx=x0; tx<=x1; tx++){
    var h = ((tx*73856093) ^ (ty*19349663)) % 5;
    ctx.fillStyle = ['#3d6b35','#406f37','#3a6833','#42753a','#3e7036'][h<0?-h:h];
    ctx.fillRect(tx*TILE, ty*TILE, TILE, TILE);
  }
  ctx.fillStyle = '#8a7350'; ctx.fillRect(WORLD_W/2-56, 90, 112, WORLD_H-90);
  ctx.fillStyle = '#7d9ec4'; ctx.beginPath(); ctx.ellipse(240, 380, 90, 52, 0, 0, Math.PI*2); ctx.fill();
  if(dist(G.player, GATE) < 130 && Math.floor(G.t*2)%2===0){
    ctx.strokeStyle = 'rgba(255,217,77,0.8)'; ctx.lineWidth = 2/QV;
    ctx.beginPath(); ctx.arc(GATE.x, GATE.y, GATE.r+8, 0, Math.PI*2); ctx.stroke();
  }
  drawCircleZoneGround();
  ctx.restore();
  var draws = [];
  for(var i=0;i<TREES.length;i++){ var t = TREES[i];
    if(t.x < cam.x-60 || t.x > cam.x+W+60 || t.y < cam.y-80 || t.y > cam.y+VH+60) continue;
    (function(tt){ draws.push({y:tt.y, f:function(){ drawTree(tt); }}); })(t);
  }
  draws.push({y:GATE.y, f:drawGate});
  G.mobs.forEach(function(mo){ draws.push({y:mo.y, f:function(){ drawMob(mo); }}); });
  party().forEach(function(mb){ draws.push({y:mb.y, f:function(){ drawChibi(mb); }}); });
  draws.sort(function(a, b){ return a.y - b.y; });
  draws.forEach(function(d){ d.f(); });
  drawCircleLabel();
  if(G.rewind){
    ctx.strokeStyle = '#ffe98a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(vx(G.sero.x), vy(G.sero.y)-2, 26, -Math.PI/2, -Math.PI/2 + Math.PI*2*(G.rewind.t/G.rewind.need)); ctx.stroke();
  }
  drawFloatsParts();
}
function drawBossBody(){
  var b = G.boss;
  var bx = vx(b.x), by = vy(b.y);
  var bob = Math.sin(b.walk)*2;
  by += bob;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(bx, vy(b.y)+62, 92, 13, 0, 0, Math.PI*2); ctx.fill();
  var armCol = b.rage > 0 ? '#8a4a3a' : '#6d6a72';
  function drawArm(side){
    var arm = side < 0 ? b.armR : b.armL;
    var ax = bx + side*86, ay = by + 16;
    if(arm.broken){
      ctx.fillStyle = '#4c4a50'; ctx.fillRect(bx + side*58 - 10, by - 6, 20, 22);
      return;
    }
    ctx.strokeStyle = armCol; ctx.lineWidth = 21;
    ctx.beginPath(); ctx.moveTo(bx + side*50, by - 18); ctx.lineTo(ax, ay); ctx.stroke();
    ctx.beginPath(); ctx.arc(ax, ay, 33, 0, Math.PI*2); ctx.fillStyle = armCol; ctx.fill();
    circle(ax-9, ay-8, 6, '#7d7a84'); circle(ax+9, ay-8, 6, '#7d7a84'); circle(ax, ay+6, 6, '#7d7a84');
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(ax-24, ay-52, 48, 6);
    ctx.fillStyle = '#ff9a5c'; ctx.fillRect(ax-24, ay-52, 48*Math.max(0, arm.hp/arm.maxhp), 6);
  }
  drawArm(-1); drawArm(1);
  ctx.fillStyle = b.rage > 0 ? '#7d5a50' : '#63606a';
  ctx.beginPath(); ctx.ellipse(bx, by, 62, 72, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#54525c'; ctx.fillRect(bx-40, by-92, 80, 34);
  circle(bx-18, by-34, 5, '#3c3a42'); circle(bx+18, by-34, 5, '#3c3a42');
  var coreOpen = b.armR.broken && b.armL.broken;
  circle(bx, by+8, coreOpen ? 17 : 10, coreOpen ? '#ffd94d' : '#9a4a3a');
  if(coreOpen && Math.floor(G.t*3)%2===0){ ctx.strokeStyle = '#ffd94d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by+8, 24, 0, Math.PI*2); ctx.stroke(); }
  circle(bx-14, by-66, 4.5, '#ff5a4a'); circle(bx+14, by-66, 4.5, '#ff5a4a');
  if(b.stun > 0){ ctx.fillStyle = '#ffe98a'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('ひるんでいる', bx, by-112); }
}
function drawBoss(){
  ctx.fillStyle = '#373040'; ctx.fillRect(0, 0, W, H);
  var b = G.boss;
  ctx.save(); groundTransform();
  ctx.fillStyle = '#4c4453'; ctx.fillRect(0, 100, W, H-60);
  ctx.fillStyle = '#554c60';
  for(var ty=0; ty<9; ty++) for(var tx=0; tx<7; tx++)
    if((tx+ty)%2===0) ctx.fillRect(tx*80+4, 110+ty*76, 72, 68);
  ctx.strokeStyle = 'rgba(255,217,77,0.25)'; ctx.lineWidth = 2/QV;
  ctx.strokeRect(14, 118, W-28, H-140);
  if(b){
    b.teles.forEach(function(tg){
      var p = 1 - tg.t/tg.lead;
      ctx.fillStyle = 'rgba(255,60,40,' + (0.13 + 0.13*p) + ')';
      ctx.beginPath(); ctx.arc(tg.x, tg.y, tg.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,80,60,0.9)'; ctx.lineWidth = 2/QV;
      ctx.beginPath(); ctx.arc(tg.x, tg.y, tg.r*(1-p*0.55), 0, Math.PI*2); ctx.stroke();
    });
    b.rings.forEach(function(rg){
      ctx.strokeStyle = 'rgba(255,150,90,0.85)'; ctx.lineWidth = 7/QV;
      ctx.beginPath(); ctx.arc(b.x, b.y, rg.r, 0, Math.PI*2); ctx.stroke();
    });
  }
  drawCircleZoneGround();
  ctx.restore();
  if(b && !b.dead){
    var fp = currentFocusPoint();
    ctx.strokeStyle = '#ffd94d'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(vx(fp.x), vy(fp.y)+4, fp.r+7, (fp.r+7)*QV, 0, 0, Math.PI*2); ctx.stroke();
    if(G.reading > 0){
      var next = !b.armR.broken ? {x:b.x-86, y:b.y+16} : (!b.armL.broken ? {x:b.x+86, y:b.y+16} : null);
      if(next){ ctx.fillStyle = '#7ee787'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('▼ 順番', vx(next.x), vy(next.y)-52); }
    }
  }
  var draws = [];
  if(b && !b.dead) draws.push({y:b.y+56, f:drawBossBody});
  party().forEach(function(mb){ draws.push({y:mb.y, f:function(){ drawChibi(mb); }}); });
  draws.sort(function(a, bb){ return a.y - bb.y; });
  draws.forEach(function(d){ d.f(); });
  drawCircleLabel();
  if(G.rewind){
    ctx.strokeStyle = '#ffe98a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(vx(G.sero.x), vy(G.sero.y)-2, 26, -Math.PI/2, -Math.PI/2 + Math.PI*2*(G.rewind.t/G.rewind.need)); ctx.stroke();
  }
  drawFloatsParts();
  if(G.clear){
    ctx.fillStyle = 'rgba(10,6,20,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd94d'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('ボス討伐成功', W/2, H/2 - 10);
    ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
    ctx.fillText('「はじめから」でもう一度遊べます', W/2, H/2 + 26);
  }
  if(G.over){
    ctx.fillStyle = 'rgba(10,6,20,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff9a8a'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('全滅してしまった', W/2, H/2 - 10);
    ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
    ctx.fillText('「はじめから」で再挑戦できます', W/2, H/2 + 26);
  }
}
function draw(){
  if(!G) return;
  ctx.save();
  if(G.shake > 0) ctx.translate((Math.random()*2-1)*5*G.shake*3, (Math.random()*2-1)*5*G.shake*3);
  if(G.mode === 'field') drawField(); else drawBoss();
  ctx.restore();
  if(G.mode === 'field' && (G.over || G.clear)){
    ctx.fillStyle = 'rgba(10,6,20,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff9a8a'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(G.over ? '全滅してしまった' : 'クリア', W/2, H/2);
  }
}

/* ---------- HUD ---------- */
var hudEls = [document.getElementById('p0'), document.getElementById('p1'), document.getElementById('p2')];
var bossbarEl = document.getElementById('bossbar');
function memberStatus(m){
  if(m.down) return '倒れている';
  if(m.kind === 'sero'){
    var s = G.reading > 0 ? '星読み あと' + Math.ceil(G.reading) + '秒' : '星読み 待機中';
    return s + '／時戻し ' + (G.rewindCharge > 0 ? 'あり' : '使用済み');
  }
  if(m.kind === 'gyutan'){
    if(G.circle) return '守護陣 展開中';
    return G.circleCd > 0 ? '守護陣 あと' + Math.ceil(G.circleCd) + '秒' : '守護陣 準備OK';
  }
  return 'ザコ討伐 ' + G.kills + '体／ラテ ' + G.late;
}
function updateHud(){
  if(!G) return;
  party().forEach(function(m, i){
    var el = hudEls[i];
    var pct = Math.max(0, m.hp/m.maxhp*100);
    el.className = 'party' + (m.down ? ' down' : '');
    el.innerHTML = '<span class="nm">' + m.name + '</span> HP ' + Math.ceil(m.hp) + '/' + m.maxhp +
      '<div class="bar' + (pct < 30 ? ' low' : '') + '"><i style="width:' + pct + '%"></i></div>' +
      '<div>' + memberStatus(m) + '</div>';
  });
  var gb = document.getElementById('btnGauge');
  gb.textContent = '魔王の裁き ' + Math.floor(G.gauge) + '%';
  gb.className = 'gauge' + (G.gauge >= 100 ? ' full' : '');
  document.getElementById('btnSlash').disabled = G.slashCd > 0 || G.player.down;
  document.getElementById('btnSlash').textContent = G.slashCd > 0 ? '魔剣連斬（' + Math.ceil(G.slashCd) + '）' : '魔剣連斬';
  if(G.mode === 'boss' && G.boss){
    var b = G.boss;
    bossbarEl.style.display = 'block';
    bossbarEl.innerHTML = '<span class="nm" style="font-weight:700">鉄の巨人</span> HP ' + Math.max(0, Math.ceil(b.hp)) + '/' + b.maxhp +
      '<div class="bar"><i style="width:' + Math.max(0, b.hp/b.maxhp*100) + '%"></i></div>' +
      '右腕<div class="bar arm"><i style="width:' + (b.armR.broken ? 0 : b.armR.hp/b.armR.maxhp*100) + '%"></i></div>' +
      '左腕<div class="bar arm"><i style="width:' + (b.armL.broken ? 0 : b.armL.hp/b.armL.maxhp*100) + '%"></i></div>';
  } else bossbarEl.style.display = 'none';
}

/* ---------- ループ ---------- */
var lastTs = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs)/1000); lastTs = ts;
  if(dt > 0){ step(dt); draw(); updateHud(); }
}
freshGame();
requestAnimationFrame(loop);

/* テスト用ハンドル */
window.__BR = { get G(){ return G; }, freshGame:freshGame, step:step, enterBoss:enterBoss,
  hurtMember:hurtMember, bossHit:bossHit, tapAt:tapAt, party:party };
</script>
