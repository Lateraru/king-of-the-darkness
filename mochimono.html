<script>
(function(){
  "use strict";
  var KEY = 'maouMochimonoV1';
  var boxes = Array.prototype.slice.call(document.querySelectorAll('input[type=checkbox][data-k]'));
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { saved = {}; }
  var countLine = document.getElementById('countLine');
  var meterBar = document.getElementById('meterBar');
  var doneMsg = document.getElementById('doneMsg');
  function refresh(){
    var n = 0;
    boxes.forEach(function(b){
      if (b.checked) n++;
      b.parentNode.className = 'item' + (b.checked ? ' done' : '');
    });
    countLine.textContent = n + ' / ' + boxes.length + ' そろいました';
    meterBar.style.width = (boxes.length ? (n / boxes.length * 100) : 0) + '%';
    doneMsg.style.display = (n === boxes.length && boxes.length > 0) ? '' : 'none';
    var out = {};
    boxes.forEach(function(b){ if (b.checked) out[b.getAttribute('data-k')] = 1; });
    try { localStorage.setItem(KEY, JSON.stringify(out)); } catch(e) {}
  }
  boxes.forEach(function(b){
    if (saved[b.getAttribute('data-k')]) b.checked = true;
    b.addEventListener('change', refresh);
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    boxes.forEach(function(b){ b.checked = false; });
    refresh();
  });
  refresh();
})();
</script>


<script>
/* 来訪者カウンター: デプロイ時に STATS_BASE へ接続先を設定（それまでは何もしません） */
(function(){
  var STATS_BASE = '';
  if (!STATS_BASE) return;
  try {
    var slug = 'site';
    var today = new Date().toLocaleDateString('sv-SE');
    var seen = {};
    try { seen = JSON.parse(localStorage.getItem('maouHitV1') || '{}'); } catch (e) {}
    if (seen[slug] === today) return;
    seen[slug] = today;
    try { localStorage.setItem('maouHitV1', JSON.stringify(seen)); } catch (e) {}
    fetch(STATS_BASE + '/api/hit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: slug }), keepalive: true }).catch(function(){});
  } catch (e) {}
})();
</script>
