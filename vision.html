<script>

function shareSite(){

<script>
function $(id){ return document.getElementById(id); }
var BANK = [
  ['黒猫', '白猫', '三毛猫'],
  ['金貨', '銀貨', '銅貨'],
  ['青い鳥', '青い海', '青い空'],
  ['月曜日', '火曜日', '水曜日'],
  ['魔法陣', '魔法瓶', '魔法院'],
  ['ポーション', 'モーション', 'ローション'],
  ['魔王城', '魔王窟', '魔界城'],
  ['図書館', '図書室', '博物館'],
  ['異世界', '異次元', '異国'],
  ['星空', '星屑', '星祭り'],
  ['回復薬', '解毒薬', '回復魔法'],
  ['温泉旅行', '温泉旅館', '温泉饅頭'],
  ['メロディ', 'メロディー', 'メロデー'],
  ['ドラゴン', 'トラゴン', 'ドラコソ'],
  ['転生', '転世', '転生者'],
  ['魔法少女', '魔法少年', '魔法使い'],
  ['パンケーキ', 'ホットケーキ', 'パソケーキ'],
  ['剣と盾', '剣と魔法', '弓と矢'],
  ['魔王らてらる', '魔王らて子', '魔王らてらら']
];
var TOTAL_Q = 10, SPIN_TICKS = 375; // 約6秒
var qs = [], qi = 0, score = 0, correctCount = 0;
var spinning = false, angle = 0, degPerTick = 4, dir = 1, ticksLeft = 0, timer = null, correctIdx = -1, answered = false;
var best = 0;
try { best = parseInt(localStorage.getItem('maouVisionBest') || '0', 10) || 0; } catch(e) {}
if (best) $('best').textContent = best;

function shuffle(a){
  var arr = a.slice();
  for (var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function periodFor(q){ return Math.max(0.45, 1.3 - q * 0.095); }
function titleFor(n){
  if (n >= 10) return '動体視力の達人';
  if (n >= 8) return '鷹の目';
  if (n >= 6) return 'なかなかの目';
  if (n >= 4) return '普通の目';
  return 'もっと鍛えよう';
}
function startGame(){
  qs = shuffle(BANK).slice(0, TOTAL_Q);
  qi = 0; score = 0; correctCount = 0;
  $('score').textContent = '0';
  $('btnGo').style.display = 'none';
  startQuestion();
}
function startQuestion(){
  answered = false;
  var set = qs[qi];
  var order = shuffle([0, 1, 2]);
  correctIdx = order.indexOf(0);
  for (var k = 0; k < 3; k++){ $('c' + k).textContent = set[order[k]]; $('c' + k).className = ''; }
  $('progress').textContent = '第 ' + (qi + 1) + ' 問 / ' + TOTAL_Q;
  $('feedback').textContent = '';
  $('choices').style.display = 'none';
  $('btnNext').style.display = 'none';
  $('btnGo').style.display = 'inline-block';
  $('btnGo').textContent = 'こたえる';
  var w = $('word');
  w.textContent = set[0];
  angle = 0;
  dir = Math.random() < 0.5 ? 1 : -1;
  degPerTick = 360 / (periodFor(qi) * 1000 / 16) * dir;
  ticksLeft = SPIN_TICKS;
  spinning = true;
  w.style.transform = 'rotate(0deg)';
  clearInterval(timer);
  timer = setInterval(tick, 16);
}
function tick(){
  if (!spinning) return;
  angle += degPerTick;
  $('word').style.transform = 'rotate(' + angle + 'deg)';
  ticksLeft--;
  if (ticksLeft <= 0) stopSpin();
}
function stopSpin(){
  if (!spinning) return;
  spinning = false;
  clearInterval(timer);
  $('word').style.transform = 'rotate(' + angle + 'deg)';
  $('btnGo').style.display = 'none';
  $('choices').style.display = 'flex';
  for (var k = 0; k < 3; k++) $('c' + k).disabled = false;
}
function answer(i){
  if (answered || spinning) return;
  answered = true;
  var set = qs[qi];
  for (var k = 0; k < 3; k++){
    $('c' + k).disabled = true;
    if (k === correctIdx) $('c' + k).className = 'right';
    else if (k === i) $('c' + k).className = 'wrong';
  }
  $('word').style.transform = 'rotate(0deg)';
  if (i === correctIdx){
    correctCount++;
    score += 100 + qi * 10;
    $('feedback').textContent = '⭕ 正解！　「' + set[0] + '」でした';
    $('feedback').style.color = '#57ab5a';
  } else {
    $('feedback').textContent = '❌ 不正解　正解は「' + set[0] + '」でした';
    $('feedback').style.color = '#e5484d';
  }
  $('score').textContent = score;
  $('btnNext').style.display = 'inline-block';
  $('btnNext').textContent = qi + 1 >= TOTAL_Q ? '結果を見る' : '次へ';
}
function finish(){
  $('progress').textContent = '終了';
  $('word').textContent = 'おつかれさまでした';
  $('choices').style.display = 'none';
  $('btnNext').style.display = 'none';
  $('feedback').textContent = '';
  $('visionResult').textContent = '正解 ' + correctCount + ' / ' + TOTAL_Q + ' 問　スコア ' + score + ' 点　称号：' + titleFor(correctCount);
  if (score > best){
    best = score;
    $('best').textContent = best;
    try { localStorage.setItem('maouVisionBest', String(best)); } catch(e) {}
  }
  showOverNav();
}
$('btnGo').addEventListener('click', function(){
  if (spinning) { stopSpin(); return; }
  if (qi === 0 && qs.length === 0) { startGame(); return; }
  startGame();
});
$('btnNext').addEventListener('click', function(){
  qi++;
  if (qi >= TOTAL_Q) finish();
  else startQuestion();
});
for (var k = 0; k < 3; k++){
  (function(idx){ $('c' + idx).addEventListener('click', function(){ answer(idx); }); })(k);
}
</script>

<script>
/* 人気カウンター: デプロイ時に STATS_BASE へ接続先を設定（それまでは何もしません） */
(function(){
  var STATS_BASE = '';
  if (!STATS_BASE) return;
  try {
    var slug = 'vision';
    var today = new Date().toLocaleDateString('sv-SE');
    var seen = {};
    try { seen = JSON.parse(localStorage.getItem('maouHitV1') || '{}'); } catch (e) {}
    if (seen[slug] === today) return;
    seen[slug] = today;
    try { localStorage.setItem('maouHitV1', JSON.stringify(seen)); } catch (e) {}
    fetch(STATS_BASE + '/api/hit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: slug }), keepalive: true }).catch(function(){});
  } catch (e) {}
})();
</script>

<script>
/* 導線クリック記録: デプロイ時に STATS_BASE へ接続先を設定（それまでは何もしません） */
(function(){
  var STATS_BASE = '';
  if (!STATS_BASE) return;
  document.addEventListener('click', function(ev){
    var a = (ev.target && ev.target.closest) ? ev.target.closest('a[href]') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    var dest = '';
    if (href.indexOf('store.line.me') >= 0) dest = 'line';
    else if (href.indexOf('line.me/ti/g2') >= 0) dest = 'linechat';
    else if (href.indexOf('YL26sVq0rjE') >= 0) dest = 'mv404';
    else if (href.indexOf('6c3PI1Vy3Nc') >= 0) dest = 'healing';
    else if (href.indexOf('youtube.com/@latemarined') >= 0) dest = 'youtube';
    if (!dest) return;
    fetch(STATS_BASE + '/api/click', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to: dest }), keepalive: true }).catch(function(){});
  }, true);
})();
</script>
